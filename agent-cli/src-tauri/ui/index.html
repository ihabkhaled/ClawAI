<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ClawAgent — Command Palette</title>
  <style>
    body {
      margin: 0;
      padding: 16px;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      background: #1a1a1a;
      color: #e5e5e5;
    }
    h1 { font-size: 18px; margin-bottom: 12px; }
    .pending { background: #2a2a2a; padding: 12px; border-radius: 6px; margin-bottom: 8px; }
    .pending-class { font-family: ui-monospace, monospace; font-size: 12px; color: #888; }
    .pending-target { font-family: ui-monospace, monospace; font-size: 12px; margin-top: 4px; }
    .actions { margin-top: 8px; }
    .actions button { margin-right: 8px; padding: 4px 12px; cursor: pointer; }
    button.approve { background: #2ecc71; color: white; border: none; border-radius: 4px; }
    button.reject { background: #e74c3c; color: white; border: none; border-radius: 4px; }
    .empty { color: #888; font-style: italic; }
  </style>
</head>
<body>
  <h1>Pending Capability Approvals</h1>
  <div id="list"><div class="empty">Loading…</div></div>
  <script type="module">
    const { invoke } = window.__TAURI__.core;
    async function refresh() {
      try {
        const items = await invoke('get_pending_capabilities');
        const list = document.getElementById('list');
        if (items.length === 0) {
          list.innerHTML = '<div class="empty">No pending approvals.</div>';
          return;
        }
        list.innerHTML = items
          .map(
            (i) => `
            <div class="pending">
              <div class="pending-class">${i.capabilityClass}.${i.capabilityOperation} — risk ${i.riskLabel} (${i.riskScore})</div>
              <div class="pending-target">${i.matchedPolicyName ?? '(no policy)'}</div>
              <div class="actions">
                <button class="approve" onclick="window._approve('${i.id}')">Approve</button>
                <button class="reject" onclick="window._reject('${i.id}')">Reject</button>
              </div>
            </div>`,
          )
          .join('');
      } catch (e) {
        document.getElementById('list').innerHTML =
          `<div class="empty">Error: ${e}</div>`;
      }
    }
    window._approve = async (id) => {
      await invoke('approve_capability', { id });
      refresh();
    };
    window._reject = async (id) => {
      await invoke('reject_capability', { id, reason: 'rejected via tray' });
      refresh();
    };
    refresh();
    setInterval(refresh, 5000);
  </script>
</body>
</html>
