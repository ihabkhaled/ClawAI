# docker-compose.ollama.yml — Ollama LLM Runtime
# Usage: docker compose -f docker-compose.ollama.yml up -d
# Usage: ../scripts/claw.sh ollama:up
# Auto-pulls qwen3:1.7b on first start for routing.
# Requires: docker-compose.databases.yml running first (claw-network must exist)
#
# Reads environment variables from the root .env file.
# Copy .env.example to .env before running.

name: claw

# Every container logs through json-file with rotation, and tags each line
# with its service so the log shipper can say where it came from. Without
# rotation the default driver grew without bound; without the label the
# shipped lines could not be attributed (json-file does not record names).
x-claw-logging: &claw-logging
  driver: json-file
  options:
    max-size: '20m'
    max-file: '5'
    labels: 'claw.service'

services:
  ollama:
    labels:
      claw.service: ollama
    logging: *claw-logging
    # Local-AI runtime component. Created only when the local-ai compose
    # profile is active (CLAW_LOCAL_AI=true via scripts/claw.sh or installer).
    profiles: ['local-ai']
    image: ollama/ollama:latest
    container_name: claw-ollama
    restart: unless-stopped
    # Loopback only (ADR-146). Ollama has no authentication of its own: a port
    # on 0.0.0.0 would let anyone on the network skip ollama-service's login
    # guard and run /api/generate or /api/pull directly. Every service reaches
    # it as http://ollama:11434 over claw-network; the host can still curl
    # 127.0.0.1:11434. Same for stable-diffusion and comfyui below.
    # tools/__tests__/local-ai-runtime-ports.test.mjs enforces it.
    ports:
      - '127.0.0.1:11434:11434'
    volumes:
      - ollama-data:/root/.ollama
    environment:
      - OLLAMA_HOST=0.0.0.0
      - OLLAMA_KEEP_ALIVE=-1
      - OLLAMA_MAX_LOADED_MODELS=2
      - OLLAMA_NUM_PARALLEL=1
      - OLLAMA_FLASH_ATTENTION=1
      - OLLAMA_KV_CACHE_TYPE=q8_0
    entrypoint: ['/bin/sh', '-c']
    command:
      - |
        # Start ollama serve in the background
        ollama serve &
        SERVE_PID=$$!

        # Wait for Ollama to be ready
        echo "Waiting for Ollama to start..."
        until ollama list > /dev/null 2>&1; do
          sleep 1
        done
        echo "Ollama is ready."

        # Auto-pull models (configurable via AUTO_PULL_MODELS env var)
        DEFAULT_MODELS="qwen3:1.7b"
        MODELS_TO_PULL="$${AUTO_PULL_MODELS:-$$DEFAULT_MODELS}"
        for MODEL in $$MODELS_TO_PULL; do
          if ! ollama list | grep -q "$${MODEL%%:*}"; then
            echo "Pulling $$MODEL..."
            ollama pull $$MODEL
            echo "$$MODEL pulled successfully."
          else
            echo "$$MODEL already available."
          fi
        done

        DEPRECATED_MODELS="phi4-mini gemma3:4b gemma2:2b tinyllama phi3:mini llama3.2:3b"
        for INSTALLED in $$(ollama list | awk 'NR>1 {print $$1}'); do
          for MODEL in $$DEPRECATED_MODELS; do
            if [ "$$INSTALLED" = "$$MODEL" ] || printf '%s' "$$INSTALLED" | grep -Fq "$$MODEL:"; then
              echo "Removing deprecated model $$INSTALLED..."
              ollama rm "$$INSTALLED" || true
              break
            fi
          done
        done

        echo "All models ready."

        # Keep the container running by waiting on the serve process
        wait $$SERVE_PID
    healthcheck:
      test: ['CMD-SHELL', 'ollama list > /dev/null 2>&1 || exit 1']
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    networks:
      - claw-network

  # ---------------------------------------------------------------------------
  # Speech (free local speech-to-text + text-to-speech) — ADR-128
  # ---------------------------------------------------------------------------
  # speaches: one CPU container, OpenAI-compatible /v1/audio/transcriptions
  # (faster-whisper) and /v1/audio/speech (Kokoro). file-service (STT) and
  # chat-service (read aloud) call it as the LOCAL provider over claw-network:
  # LOCAL_SPEECH_BASE_URL=http://speech:8000. No published port and no nginx
  # route: nothing outside the stack talks to it. Unmetered (PAYG-exempt).
  # The model ids below are pinned in code (LOCAL_TRANSCRIPTION_MODEL in
  # file-service, LOCAL_TTS_MODEL in chat-service) - change them together.
  speech:
    labels:
      claw.service: speech
    logging: *claw-logging
    # Local-AI runtime component. Created only when the local-ai compose
    # profile is active (CLAW_LOCAL_AI=true via scripts/claw.sh or installer).
    profiles: ['local-ai']
    image: ghcr.io/speaches-ai/speaches:0.8.3-cpu
    container_name: claw-speech
    restart: unless-stopped
    volumes:
      - speech-models-data:/home/ubuntu/.cache/huggingface/hub
    environment:
      # Free the model RAM after 5 idle minutes; the next call reloads it.
      - WHISPER__TTL=300
    entrypoint: ['/bin/sh', '-c']
    command:
      - |
        uvicorn --factory speaches.main:create_app &
        SERVE_PID=$$!

        echo "Waiting for speech server to start..."
        until python -c "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')" > /dev/null 2>&1; do
          sleep 1
        done
        echo "Speech server is ready."

        # speaches does NOT pull models lazily (an uninstalled model is a 404),
        # so install exactly the two the stack uses. Idempotent: an installed
        # model answers immediately from the volume.
        for MODEL in Systran/faster-whisper-small speaches-ai/Kokoro-82M-v1.0-ONNX; do
          echo "Installing $$MODEL..."
          python -c "import sys, urllib.request; urllib.request.urlopen(urllib.request.Request('http://localhost:8000/v1/models/' + sys.argv[1], method='POST'), timeout=1800)" "$$MODEL" \
            && echo "$$MODEL ready." || echo "$$MODEL install failed (will retry on next start)."
        done

        wait $$SERVE_PID
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'python -c "import urllib.request; urllib.request.urlopen(''http://localhost:8000/health'')" || exit 1',
        ]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    networks:
      - claw-network

  # ---------------------------------------------------------------------------
  # Stable Diffusion (Local Image Generation)
  # ---------------------------------------------------------------------------
  stable-diffusion:
    labels:
      claw.service: stable-diffusion
    logging: *claw-logging
    # Local-AI runtime component. Created only when the local-ai compose
    # profile is active (CLAW_LOCAL_AI=true via scripts/claw.sh or installer).
    profiles: ['local-ai']
    image: ghcr.io/ai-dock/stable-diffusion-webui:latest
    container_name: claw-stable-diffusion
    restart: unless-stopped
    ports:
      - '127.0.0.1:7860:7860'
    volumes:
      - sd-models-data:/opt/stable-diffusion-webui/models
    environment:
      # CPU-mode flags: --skip-torch-cuda-test --use-cpu all lets SD start
      # without a GPU, and --no-half --precision full forces FP32 because
      # SDXL Turbo weights are FP16 and CPU torch can't mix
      # `c10::Half` bias with FP32 input — generation crashes with
      # `Input type (float) and bias type (c10::Half) should be the same`.
      # The NVIDIA overlay (docker-compose.dev.ollama.gpu-nvidia.yml)
      # overrides this to drop the CPU flags when a GPU is available.
      - COMMANDLINE_ARGS=--api --listen --skip-torch-cuda-test --use-cpu all --no-half --precision full
      # ai-dock wraps SD in a Caddy auth-proxy on port 7860 by default.
      # Without this flag every API call from claw-image-service gets a
      # 302 redirect to /login and image generation silently fails.
      # Auth isn't useful here — port 7860 is only reachable over the
      # internal claw-network.
      - WEB_ENABLE_AUTH=false
    healthcheck:
      test:
        ['CMD-SHELL', 'wget -qO- http://localhost:7860/sdapi/v1/sd-models 2>/dev/null || exit 1']
      interval: 30s
      timeout: 15s
      retries: 10
      start_period: 180s
    networks:
      - claw-network

  # ---------------------------------------------------------------------------
  # ComfyUI (Local Image Generation — FLUX, SD 3.5, SDXL-Lightning)
  # ---------------------------------------------------------------------------
  # The ollama-service container ALSO mounts `comfyui-models-data` (read-write)
  # so it can drop HuggingFace-downloaded weights into ComfyUI's models tree.
  # See claw-ollama-service entry in docker-compose.dev.services.yml.
  comfyui:
    labels:
      claw.service: comfyui
    logging: *claw-logging
    # Local-AI runtime component. Created only when the local-ai compose
    # profile is active (CLAW_LOCAL_AI=true via scripts/claw.sh or installer).
    profiles: ['local-ai']
    image: ghcr.io/ai-dock/comfyui:latest
    container_name: claw-comfyui
    restart: unless-stopped
    ports:
      - '127.0.0.1:${COMFYUI_PORT:-8188}:8188'
    volumes:
      - comfyui-models-data:/opt/ComfyUI/models
    environment:
      # Force CPU runtime. ai-dock's base image hard-codes
      # XPU_TARGET=NVIDIA_GPU, which routes through CUDA init regardless of
      # CLI_ARGS — crashes with "Found no NVIDIA driver" when GPU isn't
      # passed through. Override to CPU at the image-target level + add
      # `--cpu` to CLI_ARGS as a second line of defence.
      # Reason for CPU-only on this stack: Blackwell (RTX 5090, SM 12.0)
      # is incompatible with the SM<=9.0 PyTorch kernels bundled in the
      # latest ai-dock image. Re-evaluate when ai-dock republishes with
      # PyTorch 2.7+/CUDA 12.8+.
      - XPU_TARGET=CPU
      - CLI_ARGS=--listen 0.0.0.0 --cpu
      # ai-dock wraps its services in a Caddy auth proxy by default. Disable it
      # because port 8188 is only reachable over the internal claw-network and
      # every request from claw-ollama-service / claw-image-service hits the
      # API directly.
      - WEB_ENABLE_AUTH=false
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost:8188/system_stats 2>/dev/null || exit 1']
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 120s
    networks:
      - claw-network

volumes:
  ollama-data:
  speech-models-data:
  sd-models-data:
  comfyui-models-data:

networks:
  claw-network:
    external: true
    name: claw-network
