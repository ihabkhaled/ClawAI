# NVIDIA GPU passthrough overlay (prod) for claw-llamacpp-service.
# Auto-loaded by ../scripts/claw.sh --prod when nvidia-smi is detected.

name: claw

services:
  llamacpp-service:
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities:
                - gpu
                - compute
                - utility
    environment:
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
