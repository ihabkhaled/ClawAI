# =============================================================================
# docker-compose.prod.services.yml — Production Backend & Frontend Services
# =============================================================================
# Contains: All NestJS microservices, Nginx reverse proxy, Next.js frontend
# Requires: docker-compose.prod.databases.yml running first (claw-network must exist)
# Uses production Dockerfiles (not Dockerfile.dev), no source volume mounts.
#
# All services read environment variables from the root .env file.
# Copy .env.example to .env before running.
#
# Usage:
#   docker compose -f docker-compose.prod.services.yml up -d
#   ../scripts/claw.sh --prod services:up
# =============================================================================

name: claw

services:
  # ---------------------------------------------------------------------------
  # Microservices
  # ---------------------------------------------------------------------------
  auth-service:
    build:
      context: ..
      dockerfile: apps/claw-auth-service/Dockerfile
    container_name: claw-auth-service
    restart: unless-stopped
    env_file: ../.env
    environment:
      SEED_ON_START: 'true'
    ports:
      - '4001:4001'
    volumes:
      - ../certs:/certs:ro
      # Read-write, unlike every other bind auth-service gets: the deployment
      # page clears a stuck rollout and pauses the automatic lane by writing
      # .deploy/status.json and .deploy/automation.json. deploy-prod.sh owns
      # deployed-sha and history.log and simply overwrites status.json on its
      # next phase, so the two writers never contend for the same fact.
      - ../.deploy:/app/.deploy
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'wget --no-check-certificate -qO- https://localhost:4001/api/v1/health || exit 1',
        ]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - claw-network

  chat-service:
    build:
      context: ..
      dockerfile: apps/claw-chat-service/Dockerfile
    # No container_name and no published host port: Docker refuses to scale a
    # service that fixes either, because four containers cannot share one name
    # or bind one host port. nginx reaches this service by its network alias
    # (https://chat-service:4002) and re-resolves it per request, so dropping
    # the host publish costs nothing and stops the service being reachable from
    # outside the compose network at all.
    restart: unless-stopped
    env_file: ../.env
    # Replica count. 1 unless raised deliberately — every other value requires
    # the cross-replica stream bus and Stop broadcast to be present, which they
    # are as of the commits referenced in ADR-077.
    deploy:
      replicas: ${CHAT_SERVICE_REPLICAS:-1}
    volumes:
      - ../certs:/certs:ro
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'wget --no-check-certificate -qO- https://localhost:4002/api/v1/health || exit 1',
        ]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - claw-network

  connector-service:
    build:
      context: ..
      dockerfile: apps/claw-connector-service/Dockerfile
    container_name: claw-connector-service
    restart: unless-stopped
    env_file: ../.env
    ports:
      - '4003:4003'
    volumes:
      - ../certs:/certs:ro
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'wget --no-check-certificate -qO- https://localhost:4003/api/v1/health || exit 1',
        ]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - claw-network

  routing-service:
    build:
      context: ..
      dockerfile: apps/claw-routing-service/Dockerfile
    container_name: claw-routing-service
    restart: unless-stopped
    env_file: ../.env
    ports:
      - '4004:4004'
    volumes:
      - ../certs:/certs:ro
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'wget --no-check-certificate -qO- https://localhost:4004/api/v1/health || exit 1',
        ]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - claw-network

  memory-service:
    build:
      context: ..
      dockerfile: apps/claw-memory-service/Dockerfile
    container_name: claw-memory-service
    restart: unless-stopped
    env_file: ../.env
    ports:
      - '4005:4005'
    volumes:
      - ../certs:/certs:ro
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'wget --no-check-certificate -qO- https://localhost:4005/api/v1/health || exit 1',
        ]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - claw-network

  file-service:
    build:
      context: ..
      dockerfile: apps/claw-file-service/Dockerfile
    container_name: claw-file-service
    restart: unless-stopped
    env_file: ../.env
    # Slice D foundation 3 — OCR pipeline. env_file already loads everything
    # from root .env; this explicit passthrough block is a documentation hint
    # so future maintainers see OCR is a file-service concern. Values are
    # interpolated from the root .env at compose-up time.
    environment:
      OCR_ENABLED: ${OCR_ENABLED:-false}
    ports:
      - '4006:4006'
    volumes:
      - file-storage-data:/data/files
      - ../certs:/certs:ro
    # Slice C foundation 3 — ZIP archive expansion uses an in-memory tmpfs so
    # ZIP-bomb extraction can never fill the host disk and so temp files
    # disappear if the container crashes mid-extraction. Cap matches the
    # ZIP_MAX_EXTRACTED_SIZE_MB default × 2 for headroom.
    tmpfs:
      - /tmp/claw-zip-extraction:size=1g,mode=1700
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'wget --no-check-certificate -qO- https://localhost:4006/api/v1/health || exit 1',
        ]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - claw-network

  audit-service:
    build:
      context: ..
      dockerfile: apps/claw-audit-service/Dockerfile
    container_name: claw-audit-service
    restart: unless-stopped
    env_file: ../.env
    ports:
      - '4007:4007'
    volumes:
      - ../certs:/certs:ro
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'wget --no-check-certificate -qO- https://localhost:4007/api/v1/health || exit 1',
        ]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - claw-network

  ollama-service:
    # Local-AI runtime component. Created only when the local-ai compose
    # profile is active (CLAW_LOCAL_AI=true via scripts/claw.sh or installer).
    profiles: ['local-ai']
    build:
      context: ..
      dockerfile: apps/claw-ollama-service/Dockerfile
    container_name: claw-ollama-service
    restart: unless-stopped
    env_file: ../.env
    ports:
      - '4008:4008'
    volumes:
      - ../certs:/certs:ro
      # Shared with claw-comfyui — the ComfyUI runtime adapter writes
      # HuggingFace-downloaded weights into this volume so ComfyUI can pick
      # them up on the next /object_info refresh. Mount is read-write because
      # the adapter creates files; ComfyUI itself never writes here at runtime.
      - comfyui-models-data:/var/lib/claw/comfyui-models
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'wget --no-check-certificate -qO- https://localhost:4008/api/v1/health || exit 1',
        ]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - claw-network

  client-logs-service:
    build:
      context: ..
      dockerfile: apps/claw-client-logs-service/Dockerfile
    container_name: claw-client-logs-service
    restart: unless-stopped
    env_file: ../.env
    ports:
      - '4010:4010'
    volumes:
      - ../certs:/certs:ro
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'wget --no-check-certificate -qO- https://localhost:4010/api/v1/health || exit 1',
        ]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - claw-network

  server-logs-service:
    build:
      context: ..
      dockerfile: apps/claw-server-logs-service/Dockerfile
    container_name: claw-server-logs-service
    restart: unless-stopped
    env_file: ../.env
    ports:
      - '4011:4011'
    volumes:
      - ../certs:/certs:ro
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'wget --no-check-certificate -qO- https://localhost:4011/api/v1/health || exit 1',
        ]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - claw-network

  health-service:
    build:
      context: ..
      dockerfile: apps/claw-health-service/Dockerfile
    container_name: claw-health-service
    restart: unless-stopped
    env_file: ../.env
    ports:
      - '4009:4009'
    volumes:
      - ../certs:/certs:ro
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'wget --no-check-certificate -qO- https://localhost:4009/api/v1/health || exit 1',
        ]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - claw-network

  # ---------------------------------------------------------------------------
  # Nginx Reverse Proxy
  # ---------------------------------------------------------------------------
  nginx:
    image: nginx:alpine
    container_name: claw-nginx
    restart: unless-stopped
    ports:
      # Port 80 is published on a production host for two reasons: Let's Encrypt
      # fetches the HTTP-01 challenge over plain HTTP on the standard port and
      # nowhere else, and a visitor typing the bare domain arrives on :80 and
      # must be redirected rather than refused. 4000 is kept so existing
      # bookmarks and internal references keep working.
      - '80:80'
      - '4000:80'
      - '443:443'
    volumes:
      - ../infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      # Shared routing table, included by both the mkcert block and every
      # generated public-domain block so the two can never drift apart.
      - ../infra/nginx/locations.conf:/etc/nginx/claw/locations.conf:ro
      # Generated Let's Encrypt server blocks (one per domain). Empty on a host
      # that has not issued a public certificate; the wildcard include tolerates
      # that, so this mount is safe unconditionally.
      - ../infra/nginx/public-tls:/etc/nginx/claw/public-tls:ro
      - ../certs:/etc/nginx/certs:ro
      # Let's Encrypt material. live/ and archive/ are root-owned 0700; the nginx
      # master process runs as root and reads the leaf at startup, so a read-only
      # mount of the real directory is correct and avoids the stale-copy failure
      # mode where nginx keeps serving a certificate certbot already renewed.
      - /etc/letsencrypt:/etc/letsencrypt:ro
      # ACME HTTP-01 webroot. certbot writes the challenge token here as root;
      # nginx only ever reads it.
      - /var/www/certbot:/var/www/certbot:ro
    depends_on:
      auth-service:
        condition: service_healthy
      chat-service:
        condition: service_healthy
      connector-service:
        condition: service_healthy
      routing-service:
        condition: service_healthy
      memory-service:
        condition: service_healthy
      file-service:
        condition: service_healthy
      audit-service:
        condition: service_healthy
      ollama-service:
        condition: service_healthy
        # Profiled service — ignore this dependency when local-ai is inactive.
        required: false
      client-logs-service:
        condition: service_healthy
      server-logs-service:
        condition: service_healthy
      health-service:
        condition: service_healthy
    networks:
      - claw-network

  # ---------------------------------------------------------------------------
  # Image Service
  # ---------------------------------------------------------------------------
  image-service:
    build:
      context: ..
      dockerfile: apps/claw-image-service/Dockerfile
    container_name: claw-image-service
    restart: unless-stopped
    env_file: ../.env
    ports:
      - '4012:4012'
    volumes:
      - ../certs:/certs:ro
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'wget --no-check-certificate -qO- https://localhost:4012/api/v1/health || exit 1',
        ]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 45s
    networks:
      - claw-network

  # ---------------------------------------------------------------------------
  # Workspace Service
  # ---------------------------------------------------------------------------
  workspace-service:
    build:
      context: ..
      dockerfile: apps/claw-workspace-service/Dockerfile
    container_name: claw-workspace-service
    restart: unless-stopped
    env_file: ../.env
    ports:
      - '4014:4014'
    volumes:
      - ../certs:/certs:ro
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'wget --no-check-certificate -qO- https://localhost:4014/api/v1/health || exit 1',
        ]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 45s
    networks:
      - claw-network

  # ---------------------------------------------------------------------------
  # Agent Service
  # ---------------------------------------------------------------------------
  agent-service:
    build:
      context: ..
      dockerfile: apps/claw-agent-service/Dockerfile
    container_name: claw-agent-service
    restart: unless-stopped
    env_file: ../.env
    ports:
      - '4015:4015'
    volumes:
      - ../certs:/certs:ro
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'wget --no-check-certificate -qO- https://localhost:4015/api/v1/health || exit 1',
        ]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 45s
    networks:
      - claw-network

  # ---------------------------------------------------------------------------
  # Research Service
  # ---------------------------------------------------------------------------
  research-service:
    build:
      context: ..
      dockerfile: apps/claw-research-service/Dockerfile
    container_name: claw-research-service
    restart: unless-stopped
    env_file: ../.env
    ports:
      - '4016:4016'
    volumes:
      - ../certs:/certs:ro
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'wget --no-check-certificate -qO- https://localhost:4016/api/v1/health || exit 1',
        ]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 45s
    networks:
      - claw-network

  # ---------------------------------------------------------------------------
  # Payment Service (subscriptions, checkout, gateways, entitlement sync)
  # ---------------------------------------------------------------------------
  payment-service:
    build:
      context: ..
      dockerfile: apps/claw-payment-service/Dockerfile
    container_name: claw-payment-service
    restart: unless-stopped
    env_file: ../.env
    ports:
      - '4018:4018'
    volumes:
      - ../certs:/certs:ro
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'wget --no-check-certificate -qO- https://localhost:4018/api/v1/health || exit 1',
        ]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 45s
    networks:
      - claw-network

  # ---------------------------------------------------------------------------
  # Llamacpp Service (Local Frontier — Phase 1+)
  # ---------------------------------------------------------------------------
  llamacpp-service:
    # Local-AI runtime component. Created only when the local-ai compose
    # profile is active (CLAW_LOCAL_AI=true via scripts/claw.sh or installer).
    profiles: ['local-ai']
    build:
      context: ..
      dockerfile: apps/claw-llamacpp-service/Dockerfile
    container_name: claw-llamacpp-service
    restart: unless-stopped
    env_file: ../.env
    ports:
      - '4017:4017'
    volumes:
      - llamacpp-data:/var/lib/claw/llamacpp
      - ../certs:/certs:ro
    healthcheck:
      # llamacpp-service runs on node:26-bookworm-slim which ships curl
      # but not wget. -k skips TLS verify so the self-signed cert passes.
      test: ['CMD-SHELL', 'curl -kfs https://localhost:4017/api/v1/health || exit 1']
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s
    networks:
      - claw-network

  # ---------------------------------------------------------------------------
  # File Generation Service
  # ---------------------------------------------------------------------------
  file-generation-service:
    build:
      context: ..
      dockerfile: apps/claw-file-generation-service/Dockerfile
    container_name: claw-file-generation-service
    restart: unless-stopped
    env_file: ../.env
    ports:
      - '4013:4013'
    volumes:
      - ../certs:/certs:ro
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'wget --no-check-certificate -qO- https://localhost:4013/api/v1/health || exit 1',
        ]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 45s
    networks:
      - claw-network

  # Frontend
  # ---------------------------------------------------------------------------
  frontend:
    build:
      # Repo root, not apps/claw-frontend — the frontend workspace depends on
      # @claw/shared-types, which only resolves when npm installs from the root.
      context: ..
      dockerfile: apps/claw-frontend/Dockerfile
      args:
        # Every NEXT_PUBLIC_* the browser reads must be passed HERE, not just
        # left in .env. Next inlines these into the client bundle during the
        # build; `env_file` below only reaches the server process, so a value
        # that is missing at build time stays `undefined` in the browser no
        # matter how often the container is restarted. Adding one to .env alone
        # silently does nothing — see the comment block in the Dockerfile.
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-}
        NEXT_PUBLIC_PAYPAL_CLIENT_ID: ${NEXT_PUBLIC_PAYPAL_CLIENT_ID:-}
        NEXT_PUBLIC_GTM_ID: ${NEXT_PUBLIC_GTM_ID:-}
        NEXT_PUBLIC_GA_MEASUREMENT_ID: ${NEXT_PUBLIC_GA_MEASUREMENT_ID:-}
        NEXT_PUBLIC_ADSENSE_CLIENT_ID: ${NEXT_PUBLIC_ADSENSE_CLIENT_ID:-}
        NEXT_PUBLIC_ADSENSE_SERVING_ENABLED: ${NEXT_PUBLIC_ADSENSE_SERVING_ENABLED:-}
        NEXT_PUBLIC_ADSENSE_REVIEW_MODE: ${NEXT_PUBLIC_ADSENSE_REVIEW_MODE:-}
        NEXT_PUBLIC_ADSENSE_HOME_SLOT: ${NEXT_PUBLIC_ADSENSE_HOME_SLOT:-}
        NEXT_PUBLIC_ADSENSE_CONTENT_SLOT: ${NEXT_PUBLIC_ADSENSE_CONTENT_SLOT:-}
        NEXT_PUBLIC_ADSENSE_SHARED_CHAT_TOP_SLOT: ${NEXT_PUBLIC_ADSENSE_SHARED_CHAT_TOP_SLOT:-}
        NEXT_PUBLIC_ADSENSE_SHARED_CHAT_INLINE_SLOT: ${NEXT_PUBLIC_ADSENSE_SHARED_CHAT_INLINE_SLOT:-}
        NEXT_PUBLIC_ADSENSE_SHARED_CHAT_BOTTOM_SLOT: ${NEXT_PUBLIC_ADSENSE_SHARED_CHAT_BOTTOM_SLOT:-}
        NEXT_PUBLIC_SOCIAL_X_URL: ${NEXT_PUBLIC_SOCIAL_X_URL:-}
        NEXT_PUBLIC_SOCIAL_LINKEDIN_URL: ${NEXT_PUBLIC_SOCIAL_LINKEDIN_URL:-}
        NEXT_PUBLIC_SOCIAL_DISCORD_URL: ${NEXT_PUBLIC_SOCIAL_DISCORD_URL:-}
        NEXT_PUBLIC_ROUTING_DEBUG_CONTEXT_INSPECTOR_ENABLED: ${NEXT_PUBLIC_ROUTING_DEBUG_CONTEXT_INSPECTOR_ENABLED:-}
    container_name: claw-frontend
    restart: unless-stopped
    env_file: ../.env
    ports:
      - '${FRONTEND_PORT:-3000}:3000'
    depends_on:
      - nginx
    volumes:
      - ../certs:/certs:ro
    healthcheck:
      # 127.0.0.1, not localhost: Next binds IPv4 only (0.0.0.0:3000), while
      # `localhost` inside the container resolves to ::1 first. wget has no
      # happy-eyeballs fallback, so it fails with "Connection refused" and the
      # container is marked unhealthy forever even though it is serving every
      # request nginx sends it. That false negative blocks `depends_on:
      # service_healthy` on the next bring-up.
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:3000 || exit 1']
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 20s
    networks:
      - claw-network

volumes:
  file-storage-data:
    driver: local
  llamacpp-data:
    driver: local
  # Shared with claw-comfyui (defined in docker-compose.prod.ollama.yml).
  # Declared here as a normal named volume rather than `external: true`
  # because docker-compose merges multi-file volume definitions — both
  # files must agree on the shape. `external: true` requires the volume
  # to already exist when *any* compose file is processed, which fails
  # on fresh installs before comfyui has run once.
  comfyui-models-data:
    driver: local

networks:
  claw-network:
    external: true
    name: claw-network
