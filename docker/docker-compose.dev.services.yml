# docker-compose.services.yml — Backend microservices + Frontend + Nginx
# Usage: docker compose -f docker-compose.services.yml up -d
# Usage: ../scripts/claw.sh services:up
# Requires: docker-compose.databases.yml running first (claw-network must exist)
# All services read environment variables from the root .env file.
# Copy .env.example to .env before running.

name: claw

x-development-watch-environment: &development-watch-environment
  # Docker Desktop does not reliably forward host filesystem events from
  # Windows/macOS bind mounts. TypeScript polling keeps the existing
  # tsgo -> tsc-alias -> nodemon pipeline responsive on every dev host.
  TSC_WATCHFILE: DynamicPriorityPolling
  TSC_WATCHDIRECTORY: RecursiveDirectoryUsingDynamicPriorityPolling

# Every container logs through json-file with rotation, and tags each line
# with its service so the log shipper can say where it came from. Without
# rotation the default driver grew without bound; without the label the
# shipped lines could not be attributed (json-file does not record names).
x-claw-logging: &claw-logging
  driver: json-file
  options:
    max-size: '20m'
    max-file: '5'
    labels: 'claw.service'

services:
  # ---------------------------------------------------------------------------
  # Nginx Reverse Proxy
  # ---------------------------------------------------------------------------
  nginx:
    labels:
      claw.service: nginx
    logging: *claw-logging
    image: nginx:alpine
    container_name: claw-nginx
    restart: unless-stopped
    ports:
      # 80 is published, not just mapped to 4000, because the ACME HTTP-01
      # challenge is fetched on port 80 of the real domain and nowhere else. A
      # host that only exposes 4000 cannot renew a public certificate.
      - '80:80'
      - '4000:80'
      - '443:443'
    volumes:
      - ../infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      # The routing table is a separate file because a production server serves
      # it under two certificates. nginx.conf `include`s it unconditionally, so
      # this mount is required in dev too — without it nginx refuses to start.
      - ../infra/nginx/locations.conf:/etc/nginx/claw/locations.conf:ro
      # The next three mirror the prod nginx service, and their absence is what
      # takes a public domain down when this stack is run on a real host: the
      # `include /etc/nginx/claw/public-tls/*.conf` in nginx.conf is a WILDCARD,
      # so with nothing mounted it matches zero files, nginx starts happily, and
      # claw-ai.co silently falls through to the mkcert default_server. The site
      # answers 200 while every browser rejects the certificate — which looks
      # like an outage with no error anywhere in the logs.
      - ../infra/nginx/public-tls:/etc/nginx/claw/public-tls:ro
      # Read the real directory rather than copying: certbot renews in place and
      # a copied leaf goes stale without anything noticing.
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/certbot:/var/www/certbot:ro
      - ../certs:/etc/nginx/certs:ro
    depends_on:
      auth-service:
        condition: service_healthy
      chat-service:
        condition: service_healthy
      connector-service:
        condition: service_healthy
      routing-service:
        condition: service_healthy
      memory-service:
        condition: service_healthy
      file-service:
        condition: service_healthy
      audit-service:
        condition: service_healthy
      ollama-service:
        condition: service_healthy
        # Profiled service — ignore this dependency when local-ai is inactive.
        required: false
      client-logs-service:
        condition: service_healthy
      server-logs-service:
        condition: service_healthy
      health-service:
        condition: service_healthy
    networks:
      - claw-network

  # ---------------------------------------------------------------------------
  # Backend Microservices (DEV mode — hot-reload via volume mounts)
  # ---------------------------------------------------------------------------
  auth-service:
    labels:
      claw.service: auth-service
    logging: *claw-logging
    build:
      context: ..
      dockerfile: apps/claw-auth-service/Dockerfile.dev
    container_name: claw-auth-service
    restart: unless-stopped
    env_file: ../.env
    environment:
      <<: *development-watch-environment
    ports:
      - '4001:4001'
    volumes:
      - ../apps/claw-auth-service/package.json:/app/apps/claw-auth-service/package.json:ro
      - ../apps/claw-auth-service/tsconfig.json:/app/apps/claw-auth-service/tsconfig.json:ro
      - ../apps/claw-auth-service/tsconfig.build.json:/app/apps/claw-auth-service/tsconfig.build.json:ro
      - ../apps/claw-auth-service/src:/app/apps/claw-auth-service/src
      - ../apps/claw-auth-service/prisma:/app/apps/claw-auth-service/prisma
      - ../tools:/app/tools:ro
      - ../certs:/certs:ro
      # Read-write, unlike every other bind auth-service gets: the deployment
      # page clears a stuck rollout and pauses the automatic lane by writing
      # .deploy/status.json and .deploy/automation.json. deploy-prod.sh owns
      # deployed-sha and history.log and simply overwrites status.json on its
      # next phase, so the two writers never contend for the same fact.
      - ../.deploy:/app/.deploy
    command: ['./docker-entrypoint.dev.sh']
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'wget --no-check-certificate -qO- https://localhost:4001/api/v1/health || exit 1',
        ]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 45s
    networks:
      - claw-network

  chat-service:
    labels:
      claw.service: chat-service
    logging: *claw-logging
    build:
      context: ..
      dockerfile: apps/claw-chat-service/Dockerfile.dev
    # No container_name and no published host port: Docker refuses to scale a
    # service that fixes either. Reach it through nginx at https://claw.local,
    # which resolves the service alias per request and round-robins replicas.
    restart: unless-stopped
    env_file: ../.env
    environment:
      <<: *development-watch-environment
    # Replica count, 1 unless raised deliberately. Set CHAT_SERVICE_REPLICAS to
    # exercise the cross-replica paths locally before production does.
    deploy:
      replicas: ${CHAT_SERVICE_REPLICAS:-1}
    volumes:
      - ../apps/claw-chat-service/package.json:/app/apps/claw-chat-service/package.json:ro
      - ../apps/claw-chat-service/tsconfig.json:/app/apps/claw-chat-service/tsconfig.json:ro
      - ../apps/claw-chat-service/tsconfig.build.json:/app/apps/claw-chat-service/tsconfig.build.json:ro
      - ../apps/claw-chat-service/src:/app/apps/claw-chat-service/src
      - ../apps/claw-chat-service/prisma:/app/apps/claw-chat-service/prisma
      - ../tools:/app/tools:ro
      - ../certs:/certs:ro
    command: ['./docker-entrypoint.dev.sh']
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'wget --no-check-certificate -qO- https://localhost:4002/api/v1/health || exit 1',
        ]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 45s
    networks:
      - claw-network

  connector-service:
    labels:
      claw.service: connector-service
    logging: *claw-logging
    build:
      context: ..
      dockerfile: apps/claw-connector-service/Dockerfile.dev
    container_name: claw-connector-service
    restart: unless-stopped
    env_file: ../.env
    environment:
      <<: *development-watch-environment
    ports:
      - '4003:4003'
    volumes:
      - ../apps/claw-connector-service/package.json:/app/apps/claw-connector-service/package.json:ro
      - ../apps/claw-connector-service/tsconfig.json:/app/apps/claw-connector-service/tsconfig.json:ro
      - ../apps/claw-connector-service/tsconfig.build.json:/app/apps/claw-connector-service/tsconfig.build.json:ro
      - ../apps/claw-connector-service/src:/app/apps/claw-connector-service/src
      - ../apps/claw-connector-service/prisma:/app/apps/claw-connector-service/prisma
      - ../tools:/app/tools:ro
      - ../certs:/certs:ro
    command: ['./docker-entrypoint.dev.sh']
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'wget --no-check-certificate -qO- https://localhost:4003/api/v1/health || exit 1',
        ]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 45s
    networks:
      - claw-network

  routing-service:
    labels:
      claw.service: routing-service
    logging: *claw-logging
    build:
      context: ..
      dockerfile: apps/claw-routing-service/Dockerfile.dev
    container_name: claw-routing-service
    restart: unless-stopped
    env_file: ../.env
    environment:
      <<: *development-watch-environment
      # routing-service owns model PRICES, and an empty price table is
      # invisible: every paid model silently falls back to the provider
      # ceiling rate instead of its own. The boot seeder covers a fresh image,
      # this covers the entrypoint path, and `npm run seed:versioned` covers
      # the release lane. Three ways in, all writing the same SeedExecution
      # row, because the one that is missing is always the one an operator was
      # relying on.
      SEED_ON_START: 'true'
    ports:
      - '4004:4004'
    volumes:
      - ../apps/claw-routing-service/package.json:/app/apps/claw-routing-service/package.json:ro
      - ../apps/claw-routing-service/tsconfig.json:/app/apps/claw-routing-service/tsconfig.json:ro
      - ../apps/claw-routing-service/tsconfig.build.json:/app/apps/claw-routing-service/tsconfig.build.json:ro
      - ../apps/claw-routing-service/src:/app/apps/claw-routing-service/src
      - ../apps/claw-routing-service/prisma:/app/apps/claw-routing-service/prisma
      - ../tools:/app/tools:ro
      - ../certs:/certs:ro
    command: ['./docker-entrypoint.dev.sh']
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'wget --no-check-certificate -qO- https://localhost:4004/api/v1/health || exit 1',
