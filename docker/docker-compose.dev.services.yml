      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 45s
    networks:
      - claw-network

  ollama-service:
    labels:
      claw.service: ollama-service
    logging: *claw-logging
    # Local-AI runtime component. Created only when the local-ai compose
    # profile is active (CLAW_LOCAL_AI=true via scripts/claw.sh or installer).
    profiles: ['local-ai']
    build:
      context: ..
      dockerfile: apps/claw-ollama-service/Dockerfile.dev
    container_name: claw-ollama-service
    restart: unless-stopped
    env_file: ../.env
    environment:
      <<: *development-watch-environment
    ports:
      - '4008:4008'
    volumes:
      - ../apps/claw-ollama-service/package.json:/app/apps/claw-ollama-service/package.json:ro
      - ../apps/claw-ollama-service/tsconfig.json:/app/apps/claw-ollama-service/tsconfig.json:ro
      - ../apps/claw-ollama-service/tsconfig.build.json:/app/apps/claw-ollama-service/tsconfig.build.json:ro
      - ../apps/claw-ollama-service/src:/app/apps/claw-ollama-service/src
      - ../apps/claw-ollama-service/prisma:/app/apps/claw-ollama-service/prisma
      - ../tools:/app/tools:ro
      - ../certs:/certs:ro
      # Shared with claw-comfyui — the ComfyUI runtime adapter writes
      # HuggingFace-downloaded weights into this volume so ComfyUI can pick
      # them up on the next /object_info refresh. Mount is read-write because
      # the adapter creates files; ComfyUI itself never writes here at runtime.
      - comfyui-models-data:/var/lib/claw/comfyui-models
    command: ['./docker-entrypoint.dev.sh']
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'wget --no-check-certificate -qO- https://localhost:4008/api/v1/health || exit 1',
