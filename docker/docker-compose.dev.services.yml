# docker-compose.services.yml — Backend microservices + Frontend + Nginx
# Usage: docker compose -f docker-compose.services.yml up -d
# Usage: ../scripts/claw.sh services:up
# Requires: docker-compose.databases.yml running first (claw-network must exist)
# All services read environment variables from the root .env file.
# Copy .env.example to .env before running.

name: claw

services:
  # ---------------------------------------------------------------------------
  # Nginx Reverse Proxy
  # ---------------------------------------------------------------------------
  nginx:
    image: nginx:alpine
    container_name: claw-nginx
    restart: unless-stopped
    ports:
      - '4000:80'
      - '443:443'
    volumes:
      - ../infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ../certs:/etc/nginx/certs:ro
    depends_on:
      auth-service:
        condition: service_healthy
      chat-service:
        condition: service_healthy
      connector-service:
        condition: service_healthy
      routing-service:
        condition: service_healthy
      memory-service:
        condition: service_healthy
      file-service:
        condition: service_healthy
      audit-service:
        condition: service_healthy
      ollama-service:
        condition: service_healthy
        # Profiled service — ignore this dependency when local-ai is inactive.
        required: false
      client-logs-service:
        condition: service_healthy
      server-logs-service:
        condition: service_healthy
      health-service:
        condition: service_healthy
    networks:
      - claw-network

  # ---------------------------------------------------------------------------
  # Backend Microservices (DEV mode — hot-reload via volume mounts)
  # ---------------------------------------------------------------------------
  auth-service:
    build:
      context: ..
      dockerfile: apps/claw-auth-service/Dockerfile.dev
    container_name: claw-auth-service
    restart: unless-stopped
    env_file: ../.env
    ports:
      - '4001:4001'
    volumes:
      - ../apps/claw-auth-service/src:/app/apps/claw-auth-service/src
      - ../apps/claw-auth-service/prisma:/app/apps/claw-auth-service/prisma
      - ../certs:/certs:ro
    command: ['./docker-entrypoint.dev.sh']
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'wget --no-check-certificate -qO- https://localhost:4001/api/v1/health || exit 1',
        ]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 45s
    networks:
      - claw-network

  chat-service:
    build:
      context: ..
      dockerfile: apps/claw-chat-service/Dockerfile.dev
    container_name: claw-chat-service
    restart: unless-stopped
    env_file: ../.env
    ports:
      - '4002:4002'
    volumes:
      - ../apps/claw-chat-service/src:/app/apps/claw-chat-service/src
      - ../apps/claw-chat-service/prisma:/app/apps/claw-chat-service/prisma
      - ../certs:/certs:ro
    command: ['./docker-entrypoint.dev.sh']
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'wget --no-check-certificate -qO- https://localhost:4002/api/v1/health || exit 1',
        ]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 45s
    networks:
      - claw-network

  connector-service:
    build:
      context: ..
      dockerfile: apps/claw-connector-service/Dockerfile.dev
    container_name: claw-connector-service
    restart: unless-stopped
    env_file: ../.env
    ports:
      - '4003:4003'
    volumes:
      - ../apps/claw-connector-service/src:/app/apps/claw-connector-service/src
      - ../apps/claw-connector-service/prisma:/app/apps/claw-connector-service/prisma
      - ../certs:/certs:ro
    command: ['./docker-entrypoint.dev.sh']
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'wget --no-check-certificate -qO- https://localhost:4003/api/v1/health || exit 1',
        ]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 45s
    networks:
      - claw-network

  routing-service:
    build:
      context: ..
      dockerfile: apps/claw-routing-service/Dockerfile.dev
    container_name: claw-routing-service
    restart: unless-stopped
    env_file: ../.env
    ports:
      - '4004:4004'
    volumes:
      - ../apps/claw-routing-service/src:/app/apps/claw-routing-service/src
      - ../apps/claw-routing-service/prisma:/app/apps/claw-routing-service/prisma
      - ../certs:/certs:ro
    command: ['./docker-entrypoint.dev.sh']
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'wget --no-check-certificate -qO- https://localhost:4004/api/v1/health || exit 1',
        ]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 45s
    networks:
      - claw-network

  memory-service:
    build:
      context: ..
      dockerfile: apps/claw-memory-service/Dockerfile.dev
    container_name: claw-memory-service
    restart: unless-stopped
    env_file: ../.env
    ports:
      - '4005:4005'
    volumes:
      - ../apps/claw-memory-service/src:/app/apps/claw-memory-service/src
      - ../apps/claw-memory-service/prisma:/app/apps/claw-memory-service/prisma
      - ../certs:/certs:ro
    command: ['./docker-entrypoint.dev.sh']
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'wget --no-check-certificate -qO- https://localhost:4005/api/v1/health || exit 1',
        ]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 45s
    networks:
      - claw-network

  file-service:
    build:
      context: ..
      dockerfile: apps/claw-file-service/Dockerfile.dev
    container_name: claw-file-service
    restart: unless-stopped
    env_file: ../.env
    # Slice D foundation 3 — OCR pipeline. env_file already loads everything
    # from root .env; this explicit passthrough block is a documentation hint
    # so future maintainers see OCR is a file-service concern. Values are
    # interpolated from the root .env at compose-up time.
    environment:
      OCR_ENABLED: ${OCR_ENABLED:-false}
    ports:
      - '4006:4006'
    volumes:
      - ../apps/claw-file-service/src:/app/apps/claw-file-service/src
      - ../apps/claw-file-service/prisma:/app/apps/claw-file-service/prisma
      - file-storage-data:/data/files
      - ../certs:/certs:ro
    # Slice C foundation 3 — ZIP archive expansion uses an in-memory tmpfs so
    # ZIP-bomb extraction can never fill the host disk and so temp files
    # disappear if the container crashes mid-extraction. Cap matches the
    # ZIP_MAX_EXTRACTED_SIZE_MB default × 2 for headroom.
    tmpfs:
      - /tmp/claw-zip-extraction:size=1g,mode=1700
    command: ['./docker-entrypoint.dev.sh']
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'wget --no-check-certificate -qO- https://localhost:4006/api/v1/health || exit 1',
        ]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 45s
    networks:
      - claw-network

  audit-service:
    build:
      context: ..
      dockerfile: apps/claw-audit-service/Dockerfile.dev
    container_name: claw-audit-service
    restart: unless-stopped
    env_file: ../.env
    ports:
      - '4007:4007'
    volumes:
      - ../apps/claw-audit-service/src:/app/apps/claw-audit-service/src
      - ../certs:/certs:ro
    command: npm run dev
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'wget --no-check-certificate -qO- https://localhost:4007/api/v1/health || exit 1',
        ]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 45s
    networks:
      - claw-network

  ollama-service:
    # Local-AI runtime component. Created only when the local-ai compose
    # profile is active (CLAW_LOCAL_AI=true via scripts/claw.sh or installer).
    profiles: ['local-ai']
    build:
      context: ..
      dockerfile: apps/claw-ollama-service/Dockerfile.dev
    container_name: claw-ollama-service
    restart: unless-stopped
    env_file: ../.env
    ports:
      - '4008:4008'
    volumes:
      - ../apps/claw-ollama-service/src:/app/apps/claw-ollama-service/src
      - ../apps/claw-ollama-service/prisma:/app/apps/claw-ollama-service/prisma
      - ../certs:/certs:ro
      # Shared with claw-comfyui — the ComfyUI runtime adapter writes
      # HuggingFace-downloaded weights into this volume so ComfyUI can pick
      # them up on the next /object_info refresh. Mount is read-write because
      # the adapter creates files; ComfyUI itself never writes here at runtime.
      - comfyui-models-data:/var/lib/claw/comfyui-models
    command: ['./docker-entrypoint.dev.sh']
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'wget --no-check-certificate -qO- https://localhost:4008/api/v1/health || exit 1',
        ]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 45s
    networks:
      - claw-network

  client-logs-service:
    build:
      context: ..
      dockerfile: apps/claw-client-logs-service/Dockerfile.dev
    container_name: claw-client-logs-service
    restart: unless-stopped
    env_file: ../.env
    ports:
      - '4010:4010'
    volumes:
      - ../apps/claw-client-logs-service/src:/app/apps/claw-client-logs-service/src
      - ../certs:/certs:ro
    command: npm run dev
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'wget --no-check-certificate -qO- https://localhost:4010/api/v1/health || exit 1',
        ]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 45s
    networks:
      - claw-network

  server-logs-service:
    build:
      context: ..
      dockerfile: apps/claw-server-logs-service/Dockerfile.dev
    container_name: claw-server-logs-service
    restart: unless-stopped
    env_file: ../.env
    ports:
      - '4011:4011'
    volumes:
      - ../apps/claw-server-logs-service/src:/app/apps/claw-server-logs-service/src
      - ../certs:/certs:ro
    command: npm run dev
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'wget --no-check-certificate -qO- https://localhost:4011/api/v1/health || exit 1',
        ]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 45s
    networks:
      - claw-network

  health-service:
    build:
      context: ..
      dockerfile: apps/claw-health-service/Dockerfile.dev
    container_name: claw-health-service
    restart: unless-stopped
    env_file: ../.env
    ports:
      - '4009:4009'
    volumes:
      - ../apps/claw-health-service/src:/app/apps/claw-health-service/src
      - ../certs:/certs:ro
    command: npm run dev
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'wget --no-check-certificate -qO- https://localhost:4009/api/v1/health || exit 1',
        ]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 45s
    networks:
      - claw-network

  # ---------------------------------------------------------------------------
  # Image Service (DEV mode)
  # ---------------------------------------------------------------------------
  image-service:
    build:
      context: ..
      dockerfile: apps/claw-image-service/Dockerfile.dev
    container_name: claw-image-service
    restart: unless-stopped
    env_file: ../.env
    ports:
      - '4012:4012'
    volumes:
      - ../apps/claw-image-service/src:/app/apps/claw-image-service/src
      - ../apps/claw-image-service/prisma:/app/apps/claw-image-service/prisma
      - ../certs:/certs:ro
    command: ['./docker-entrypoint.dev.sh']
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'wget --no-check-certificate -qO- https://localhost:4012/api/v1/health || exit 1',
        ]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 45s
    networks:
      - claw-network

  # ---------------------------------------------------------------------------
  # Workspace Service (DEV mode)
  # ---------------------------------------------------------------------------
  workspace-service:
    build:
      context: ..
      dockerfile: apps/claw-workspace-service/Dockerfile.dev
    container_name: claw-workspace-service
    restart: unless-stopped
    env_file: ../.env
    ports:
      - '4014:4014'
    volumes:
      - ../apps/claw-workspace-service/src:/app/apps/claw-workspace-service/src
      - ../apps/claw-workspace-service/prisma:/app/apps/claw-workspace-service/prisma
      - ../certs:/certs:ro
    command: ['./docker-entrypoint.dev.sh']
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'wget --no-check-certificate -qO- https://localhost:4014/api/v1/health || exit 1',
        ]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 45s
    networks:
      - claw-network

  # ---------------------------------------------------------------------------
  # Agent Service (DEV mode)
  # ---------------------------------------------------------------------------
  agent-service:
    build:
      context: ..
      dockerfile: apps/claw-agent-service/Dockerfile.dev
    container_name: claw-agent-service
    restart: unless-stopped
    env_file: ../.env
    ports:
      - '4015:4015'
    volumes:
      - ../apps/claw-agent-service/src:/app/apps/claw-agent-service/src
      - ../apps/claw-agent-service/prisma:/app/apps/claw-agent-service/prisma
      - ../certs:/certs:ro
    command: ['./docker-entrypoint.dev.sh']
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'wget --no-check-certificate -qO- https://localhost:4015/api/v1/health || exit 1',
        ]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 45s
    networks:
      - claw-network

  # ---------------------------------------------------------------------------
  # Research Service (DEV mode)
  # ---------------------------------------------------------------------------
  research-service:
    build:
      context: ..
      dockerfile: apps/claw-research-service/Dockerfile.dev
    container_name: claw-research-service
    restart: unless-stopped
    env_file: ../.env
    ports:
      - '4016:4016'
    volumes:
      - ../apps/claw-research-service/src:/app/apps/claw-research-service/src
      - ../apps/claw-research-service/prisma:/app/apps/claw-research-service/prisma
      - ../certs:/certs:ro
    command: ['./docker-entrypoint.dev.sh']
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'wget --no-check-certificate -qO- https://localhost:4016/api/v1/health || exit 1',
        ]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 45s
    networks:
      - claw-network

  # ---------------------------------------------------------------------------
  payment-service:
    build:
      context: ..
      dockerfile: apps/claw-payment-service/Dockerfile.dev
    container_name: claw-payment-service
    restart: unless-stopped
    env_file: ../.env
    ports:
      - '4018:4018'
    volumes:
      - ../apps/claw-payment-service/src:/app/apps/claw-payment-service/src
      - ../apps/claw-payment-service/prisma:/app/apps/claw-payment-service/prisma
      - ../certs:/certs:ro
    command: ['./docker-entrypoint.dev.sh']
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'wget --no-check-certificate -qO- https://localhost:4018/api/v1/health || exit 1',
        ]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 45s
    networks:
      - claw-network

  # ---------------------------------------------------------------------------
  llamacpp-service:
    # Local-AI runtime component. Created only when the local-ai compose
    # profile is active (CLAW_LOCAL_AI=true via scripts/claw.sh or installer).
    profiles: ['local-ai']
    build:
      context: ..
      dockerfile: apps/claw-llamacpp-service/Dockerfile.dev
    container_name: claw-llamacpp-service
    restart: unless-stopped
    env_file: ../.env
    ports:
      - '4017:4017'
    volumes:
      - ../apps/claw-llamacpp-service/src:/app/apps/claw-llamacpp-service/src
      - ../apps/claw-llamacpp-service/prisma:/app/apps/claw-llamacpp-service/prisma
      - llamacpp-data:/var/lib/claw/llamacpp
      - ../certs:/certs:ro
    command: ['./docker-entrypoint.dev.sh']
    healthcheck:
      # llamacpp-service runs on node:26-bookworm-slim which ships curl but
      # not wget (other services use Alpine which has busybox wget). Use
      # curl -k so the self-signed TLS cert doesn't fail verification.
      test: ['CMD-SHELL', 'curl -kfs https://localhost:4017/api/v1/health || exit 1']
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s
    networks:
      - claw-network

  # ---------------------------------------------------------------------------
  file-generation-service:
    build:
      context: ..
      dockerfile: apps/claw-file-generation-service/Dockerfile.dev
    container_name: claw-file-generation-service
    restart: unless-stopped
    env_file: ../.env
    ports:
      - '4013:4013'
    volumes:
      - ../apps/claw-file-generation-service/src:/app/apps/claw-file-generation-service/src
      - ../apps/claw-file-generation-service/prisma:/app/apps/claw-file-generation-service/prisma
      - ../certs:/certs:ro
    command: ['./docker-entrypoint.dev.sh']
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'wget --no-check-certificate -qO- https://localhost:4013/api/v1/health || exit 1',
        ]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 45s
    networks:
      - claw-network

  # ---------------------------------------------------------------------------
  frontend:
    build:
      context: ../apps/claw-frontend
      dockerfile: Dockerfile.dev
    container_name: claw-frontend
    restart: unless-stopped
    env_file: ../.env
    ports:
      - '3000:3000'
    volumes:
      - ../apps/claw-frontend/src:/app/src
      - ../apps/claw-frontend/public:/app/public
      - ../certs:/certs:ro
    command: npm run dev
    depends_on:
      nginx:
        condition: service_started
    networks:
      - claw-network

volumes:
  file-storage-data:
  llamacpp-data:
  # Shared with claw-comfyui (defined in docker-compose.dev.ollama.yml).
  # Declared here as a normal named volume rather than `external: true`
  # because docker-compose merges multi-file volume definitions — both
  # files must agree on the shape. `external: true` requires the volume
  # to already exist when *any* compose file is processed, which fails
  # on fresh installs before comfyui has run once.
  comfyui-models-data:

networks:
  claw-network:
    external: true
    name: claw-network
