  # ---------------------------------------------------------------------------
  # Research Service (DEV mode)
  # ---------------------------------------------------------------------------
  research-service:
    labels:
      claw.service: research-service
    logging: *claw-logging
    build:
      context: ..
      dockerfile: apps/claw-research-service/Dockerfile.dev
    container_name: claw-research-service
    restart: unless-stopped
    env_file: ../.env
    environment:
      <<: *development-watch-environment
    ports:
      - '4016:4016'
    volumes:
      - ../apps/claw-research-service/package.json:/app/apps/claw-research-service/package.json:ro
      - ../apps/claw-research-service/tsconfig.json:/app/apps/claw-research-service/tsconfig.json:ro
      - ../apps/claw-research-service/tsconfig.build.json:/app/apps/claw-research-service/tsconfig.build.json:ro
      - ../apps/claw-research-service/src:/app/apps/claw-research-service/src
      - ../apps/claw-research-service/prisma:/app/apps/claw-research-service/prisma
      - ../tools:/app/tools:ro
      - ../certs:/certs:ro
    command: ['./docker-entrypoint.dev.sh']
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'wget --no-check-certificate -qO- https://localhost:4016/api/v1/health || exit 1',
        ]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 45s
    networks:
      - claw-network
      # The only ClawAI container on the isolated scraper network (ADR-121).
      - claw-scrapers

  # ---------------------------------------------------------------------------
  payment-service:
    labels:
      claw.service: payment-service
    logging: *claw-logging
    build:
      context: ..
      dockerfile: apps/claw-payment-service/Dockerfile.dev
    container_name: claw-payment-service
    restart: unless-stopped
    env_file: ../.env
    environment:
      <<: *development-watch-environment
    ports:
      - '4018:4018'
    volumes:
      - ../apps/claw-payment-service/package.json:/app/apps/claw-payment-service/package.json:ro
      - ../apps/claw-payment-service/tsconfig.json:/app/apps/claw-payment-service/tsconfig.json:ro
      - ../apps/claw-payment-service/tsconfig.build.json:/app/apps/claw-payment-service/tsconfig.build.json:ro
      - ../apps/claw-payment-service/src:/app/apps/claw-payment-service/src
      - ../apps/claw-payment-service/prisma:/app/apps/claw-payment-service/prisma
      - ../tools:/app/tools:ro
      - ../certs:/certs:ro
    command: ['./docker-entrypoint.dev.sh']
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'wget --no-check-certificate -qO- https://localhost:4018/api/v1/health || exit 1',
        ]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 45s
    networks:
      - claw-network

  # ---------------------------------------------------------------------------
  llamacpp-service:
    labels:
      claw.service: llamacpp-service
    logging: *claw-logging
    # Local-AI runtime component. Created only when the local-ai compose
    # profile is active (CLAW_LOCAL_AI=true via scripts/claw.sh or installer).
    profiles: ['local-ai']
    build:
      context: ..
      dockerfile: apps/claw-llamacpp-service/Dockerfile.dev
    container_name: claw-llamacpp-service
    restart: unless-stopped
    env_file: ../.env
    environment:
      <<: *development-watch-environment
    ports:
      - '4017:4017'
    volumes:
      - ../apps/claw-llamacpp-service/package.json:/app/apps/claw-llamacpp-service/package.json:ro
      - ../apps/claw-llamacpp-service/tsconfig.json:/app/apps/claw-llamacpp-service/tsconfig.json:ro
      - ../apps/claw-llamacpp-service/tsconfig.build.json:/app/apps/claw-llamacpp-service/tsconfig.build.json:ro
      - ../apps/claw-llamacpp-service/src:/app/apps/claw-llamacpp-service/src
      - ../apps/claw-llamacpp-service/prisma:/app/apps/claw-llamacpp-service/prisma
      - llamacpp-data:/var/lib/claw/llamacpp
      - ../tools:/app/tools:ro
      - ../certs:/certs:ro
    command: ['./docker-entrypoint.dev.sh']
    healthcheck:
      # llamacpp-service runs on node:26-bookworm-slim which ships curl but
      # not wget (other services use Alpine which has busybox wget). Use
      # curl -k so the self-signed TLS cert doesn't fail verification.
      test: ['CMD-SHELL', 'curl -kfs https://localhost:4017/api/v1/health || exit 1']
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s
    networks:
      - claw-network

  # ---------------------------------------------------------------------------
  file-generation-service:
    labels:
      claw.service: file-generation-service
    logging: *claw-logging
    build:
      context: ..
      dockerfile: apps/claw-file-generation-service/Dockerfile.dev
    container_name: claw-file-generation-service
    restart: unless-stopped
    env_file: ../.env
    environment:
      <<: *development-watch-environment
    ports:
      - '4013:4013'
    volumes:
      - ../apps/claw-file-generation-service/package.json:/app/apps/claw-file-generation-service/package.json:ro
      - ../apps/claw-file-generation-service/tsconfig.json:/app/apps/claw-file-generation-service/tsconfig.json:ro
      - ../apps/claw-file-generation-service/tsconfig.build.json:/app/apps/claw-file-generation-service/tsconfig.build.json:ro
      - ../apps/claw-file-generation-service/src:/app/apps/claw-file-generation-service/src
      - ../apps/claw-file-generation-service/prisma:/app/apps/claw-file-generation-service/prisma
      - ../tools:/app/tools:ro
      - ../certs:/certs:ro
    command: ['./docker-entrypoint.dev.sh']
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'wget --no-check-certificate -qO- https://localhost:4013/api/v1/health || exit 1',
        ]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 45s
    networks:
      - claw-network

  # ---------------------------------------------------------------------------
  frontend:
    labels:
      claw.service: frontend
    logging: *claw-logging
    build:
      context: ..
      dockerfile: apps/claw-frontend/Dockerfile.dev
    container_name: claw-frontend
    restart: unless-stopped
    env_file: ../.env
    environment:
      WATCHPACK_POLLING: 'true'
      CHOKIDAR_USEPOLLING: 'true'
    ports:
      - '3000:3000'
    volumes:
      - ../apps/claw-frontend/src:/app/apps/claw-frontend/src
      - ../apps/claw-frontend/tsconfig.json:/app/apps/claw-frontend/tsconfig.json:ro
      - ../apps/claw-frontend/public:/app/apps/claw-frontend/public
      - ../tools:/app/tools:ro
      - ../certs:/certs:ro
      # `npm run dev` (used outside Docker) wipes .next before every start as a
      # stale-Turbopack-cache safety net. That's fine on a host process but
      # turns every container restart into a full cold recompile, since the
      # container's writable layer (and this volume) would otherwise persist
      # the cache across restarts. `dev:docker` skips that wipe; if Turbopack
      # ever serves stale output here, clear it with
      # `docker compose ... exec frontend rm -rf .next` or by dropping this
      # volume, same as the safety net does automatically outside Docker.
      - frontend-next-cache:/app/apps/claw-frontend/.next
    command: npm run dev:docker
    depends_on:
      nginx:
        condition: service_started
    networks:
      - claw-network

  # Ships every container's stdout/stderr to server-logs-service, so all
  # logs (Nest Logger lines, stack traces, crashes, nginx, databases) are in
  # one place and readable without SSH. Reads the json-file logs READ-ONLY;
  # deliberately NOT the Docker socket, which is root on the host. See
  # infra/vector/vector.yaml and ADR-101.
  log-shipper:
    image: timberio/vector:0.46.1-debian
    container_name: claw-log-shipper
    restart: unless-stopped
    env_file: ../.env
    command: ['--config', '/etc/vector/vector.yaml']
    volumes:
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - ../infra/vector/vector.yaml:/etc/vector/vector.yaml:ro
      - ../certs:/certs:ro
      - log-shipper-data:/var/lib/vector
    labels:
      claw.service: log-shipper
    logging: *claw-logging
    depends_on:
      server-logs-service:
        condition: service_healthy
    networks:
      - claw-network

  # ---------------------------------------------------------------------------
  # Prometheus — operational metrics (ADR-113)
  # ---------------------------------------------------------------------------
  # Scrapes health-service, which already checks every service. NEVER published:
  # it has no authentication of its own, so it stays on the internal network and
  # nginx does not proxy it. Retention matches the 30-day log TTL (ADR-101).
  #
  # Its config is bind-mounted: a change needs a recreate, not a restart, which
  # scripts/deploy-prod.sh does through CONFIG_DIR_SERVICES.
  prometheus:
    image: prom/prometheus:v3.5.0
    container_name: claw-prometheus
    restart: unless-stopped
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
      - '--web.listen-address=:9090'
    volumes:
      - ../infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../certs:/certs:ro
      - prometheus-data:/prometheus
    labels:
      claw.service: prometheus
    logging: *claw-logging
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost:9090/-/healthy || exit 1']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
    depends_on:
      health-service:
        condition: service_healthy
    networks:
      - claw-network

  # ---------------------------------------------------------------------------
  # Grafana — dashboards over Prometheus, behind the admin session (ADR-115)
  # ---------------------------------------------------------------------------
  # NEVER published. nginx serves it at /grafana/ only after auth-service
  # confirms the admin cookie (auth_request), and names the admin in the header
  # Grafana's auth.proxy trusts. No built-in admin user, so no password exists.
  #
  # grafana.ini is a bind-mounted file: a change needs a recreate, not a
  # restart, which scripts/deploy-prod.sh does through CONFIG_DIR_SERVICES.
  grafana:
    image: grafana/grafana-oss:12.1.1
    container_name: claw-grafana
    restart: unless-stopped
    environment:
      GF_SERVER_ROOT_URL: ${PUBLIC_SITE_URL:-https://claw.local}/grafana/
      # Blank keeps Grafana's built-in default; nothing stores an encrypted
      # secret yet. install.sh / install.ps1 generate one.
      GF_SECURITY_SECRET_KEY: ${GRAFANA_SECRET_KEY:-}
    volumes:
      - ../infra/grafana/grafana.ini:/etc/grafana/grafana.ini:ro
      - ../infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ../infra/grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    labels:
      claw.service: grafana
    logging: *claw-logging
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost:3000/grafana/api/health || exit 1']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    depends_on:
      prometheus:
        condition: service_healthy
    networks:
      - claw-network


  # ---------------------------------------------------------------------------
  # Scraping sidecars for research-service's fetch escalation chain (ADR-121)
  # ---------------------------------------------------------------------------
  # Each sits behind its OWN compose profile and is never created unless
  # CLAW_SCRAPER_PROFILES in .env names it (scripts/claw.sh maps that to
  # COMPOSE_PROFILES), e.g. CLAW_SCRAPER_PROFILES=crawl4ai,flaresolverr.
  #
  # Internal-only: no published port, no nginx route, and attached ONLY to the
  # isolated `claw-scrapers` network — no route to any ClawAI service,
  # database, Redis or RabbitMQ. research-service is the one container on both
  # networks. Starting a profile does NOT turn the strategy on: enablement is
  # DB-level (FetchStrategyConfig, seeded DISABLED) — start the profile, then
  # PATCH /api/v1/research/fetch-strategies/<KIND> {"enabled": true}.
  # Firecrawl's own Redis/RabbitMQ/Postgres live here (not in the databases
  # file) because they are private to it and must share its compose run for
  # depends_on to work.
  crawl4ai:
    labels:
      claw.service: crawl4ai
    logging: *claw-logging
    profiles: ['crawl4ai']
    # Never older than 0.9.4 (2026-09-23): it closed two SSRF paths (robots.txt
    # fetch, link preview) and an env leak through untrusted config.
    image: unclecode/crawl4ai:0.9.4
    container_name: claw-crawl4ai
    restart: unless-stopped
    shm_size: '1gb'
    mem_limit: 4g
    pids_limit: 512
    environment:
      CRAWL4AI_MAX_TIMEOUT_MS: '60000'
    healthcheck:
      test: ['CMD', 'curl', '-fs', 'http://localhost:11235/health']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - claw-scrapers

  flaresolverr:
    labels:
      claw.service: flaresolverr
    logging: *claw-logging
    profiles: ['flaresolverr']
    # Used ONLY after a JS-interstitial signal on a robots-allowed URL; the
    # escalation policy never sends a captcha, 401, 451 or disallow here.
    image: ghcr.io/flaresolverr/flaresolverr:v3.5.2
    container_name: claw-flaresolverr
    restart: unless-stopped
    mem_limit: 1536m
    environment:
      LOG_LEVEL: info
      TZ: UTC
    healthcheck:
      test: ['CMD-SHELL', 'curl -fs http://localhost:8191/health || exit 1']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - claw-scrapers

  # Firecrawl self-host: API + its Playwright service + its own Redis,
  # RabbitMQ and Postgres. Together 8-12 GB of RAM — the heaviest profile.
  # Images pinned by digest (Firecrawl publishes no semver tags).
  firecrawl-api:
    labels:
      claw.service: firecrawl-api
    logging: *claw-logging
    profiles: ['firecrawl']
    image: ghcr.io/firecrawl/firecrawl:latest@sha256:9679231e2e5b1433a1dec02d60eed2c573bff9d2478655561687b696b1e1857d
    container_name: claw-firecrawl-api
    restart: unless-stopped
    command: ['node', 'dist/src/harness.js', '--start-docker']
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    mem_limit: 8g
    environment:
      HOST: '0.0.0.0'
      PORT: '3002'
      EXTRACT_WORKER_PORT: '3004'
      WORKER_PORT: '3005'
      ENV: local
      USE_DB_AUTHENTICATION: 'false'
      REDIS_URL: redis://firecrawl-redis:6379
      REDIS_RATE_LIMIT_URL: redis://firecrawl-redis:6379
      PLAYWRIGHT_MICROSERVICE_URL: http://firecrawl-playwright:3000/scrape
      NUQ_RABBITMQ_URL: amqp://firecrawl-rabbitmq:5672
      POSTGRES_HOST: firecrawl-postgres
      POSTGRES_PORT: '5432'
      POSTGRES_USER: firecrawl
      POSTGRES_PASSWORD: ${FIRECRAWL_POSTGRES_PASSWORD:-firecrawl-internal}
      POSTGRES_DB: firecrawl
      BULL_AUTH_KEY: ${FIRECRAWL_BULL_AUTH_KEY:-}
      NUM_WORKERS_PER_QUEUE: '4'
      CRAWL_CONCURRENT_REQUESTS: '5'
      MAX_CONCURRENT_JOBS: '3'
      BROWSER_POOL_SIZE: '3'
      HARNESS_STARTUP_TIMEOUT_MS: '60000'
    depends_on:
      firecrawl-redis:
        condition: service_healthy
      firecrawl-rabbitmq:
        condition: service_healthy
      firecrawl-postgres:
        condition: service_healthy
      firecrawl-playwright:
        condition: service_started
    healthcheck:
      test:
        [
          'CMD-SHELL',
          "node -e \"fetch('http://localhost:3002/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\"",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s
    networks:
      - claw-scrapers

  firecrawl-playwright:
    labels:
      claw.service: firecrawl-playwright
    logging: *claw-logging
    profiles: ['firecrawl']
    image: ghcr.io/firecrawl/playwright-service:latest@sha256:df1a393ce8bfc3801570a826a9b0dcc400ae48789adb4a0ad9d6cbf0229b059b
    container_name: claw-firecrawl-playwright
    restart: unless-stopped
    mem_limit: 4g
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp/.cache:noexec,nosuid,size=1g
    environment:
      PORT: '3000'
      BLOCK_MEDIA: 'true'
      MAX_CONCURRENT_PAGES: '4'
    networks:
      - claw-scrapers

  firecrawl-redis:
    labels:
      claw.service: firecrawl-redis
    logging: *claw-logging
    profiles: ['firecrawl']
    image: redis:7-alpine
    container_name: claw-firecrawl-redis
    restart: unless-stopped
    command: ['redis-server', '--save', '', '--appendonly', 'no']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - claw-scrapers

  firecrawl-rabbitmq:
    labels:
      claw.service: firecrawl-rabbitmq
    logging: *claw-logging
    profiles: ['firecrawl']
    image: rabbitmq:3-management-alpine
    container_name: claw-firecrawl-rabbitmq
    restart: unless-stopped
    healthcheck:
      test: ['CMD-SHELL', 'rabbitmq-diagnostics -q check_running']
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s
    networks:
      - claw-scrapers

  firecrawl-postgres:
    labels:
      claw.service: firecrawl-postgres
    logging: *claw-logging
    profiles: ['firecrawl']
    image: ghcr.io/firecrawl/nuq-postgres:latest@sha256:9b638af78d99873bc0ba2b57c9cbcd01df6ce96efeaa72d36cfbe0f76521e8fc
    container_name: claw-firecrawl-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: firecrawl
      POSTGRES_PASSWORD: ${FIRECRAWL_POSTGRES_PASSWORD:-firecrawl-internal}
      POSTGRES_DB: firecrawl
    volumes:
      - firecrawl-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U firecrawl -d firecrawl']
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - claw-scrapers

volumes:
  firecrawl-postgres-data:
    driver: local
  grafana-data:
    driver: local
  prometheus-data:
    driver: local
  log-shipper-data:
    driver: local
  file-storage-data:
  llamacpp-data:
  frontend-next-cache:
  # Shared with claw-comfyui (defined in docker-compose.dev.ollama.yml).
  # Declared here as a normal named volume rather than `external: true`
  # because docker-compose merges multi-file volume definitions — both
  # files must agree on the shape. `external: true` requires the volume
  # to already exist when *any* compose file is processed, which fails
  # on fresh installs before comfyui has run once.
  comfyui-models-data:

networks:
  claw-network:
    external: true
    name: claw-network
  # Isolated bridge for the scraping sidecars (ADR-121): internet egress,
  # no route to ClawAI services. Compose-managed, created on first use.
  claw-scrapers:
    name: claw-scrapers
