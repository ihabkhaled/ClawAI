      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 45s
    networks:
      - claw-network

  memory-service:
    labels:
      claw.service: memory-service
    logging: *claw-logging
    build:
      context: ..
      dockerfile: apps/claw-memory-service/Dockerfile.dev
    container_name: claw-memory-service
    restart: unless-stopped
    env_file: ../.env
    environment:
      <<: *development-watch-environment
    ports:
      - '4005:4005'
    volumes:
      - ../apps/claw-memory-service/package.json:/app/apps/claw-memory-service/package.json:ro
      - ../apps/claw-memory-service/tsconfig.json:/app/apps/claw-memory-service/tsconfig.json:ro
      - ../apps/claw-memory-service/tsconfig.build.json:/app/apps/claw-memory-service/tsconfig.build.json:ro
      - ../apps/claw-memory-service/src:/app/apps/claw-memory-service/src
      - ../apps/claw-memory-service/prisma:/app/apps/claw-memory-service/prisma
      - ../tools:/app/tools:ro
      - ../certs:/certs:ro
    command: ['./docker-entrypoint.dev.sh']
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'wget --no-check-certificate -qO- https://localhost:4005/api/v1/health || exit 1',
        ]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 45s
    networks:
      - claw-network

  file-service:
    labels:
      claw.service: file-service
    logging: *claw-logging
    build:
      context: ..
      dockerfile: apps/claw-file-service/Dockerfile.dev
    container_name: claw-file-service
    restart: unless-stopped
    env_file: ../.env
    # Slice D foundation 3 — OCR pipeline. env_file already loads everything
    # from root .env; this explicit passthrough block is a documentation hint
    # so future maintainers see OCR is a file-service concern. Values are
    # interpolated from the root .env at compose-up time.
    environment:
      <<: *development-watch-environment
      OCR_ENABLED: ${OCR_ENABLED:-false}
    ports:
      - '4006:4006'
    volumes:
      - ../apps/claw-file-service/package.json:/app/apps/claw-file-service/package.json:ro
      - ../apps/claw-file-service/tsconfig.json:/app/apps/claw-file-service/tsconfig.json:ro
      - ../apps/claw-file-service/tsconfig.build.json:/app/apps/claw-file-service/tsconfig.build.json:ro
      - ../apps/claw-file-service/src:/app/apps/claw-file-service/src
      - ../apps/claw-file-service/prisma:/app/apps/claw-file-service/prisma
      - file-storage-data:/data/files
      - ../tools:/app/tools:ro
      - ../certs:/certs:ro
    # Slice C foundation 3 — ZIP archive expansion uses an in-memory tmpfs so
    # ZIP-bomb extraction can never fill the host disk and so temp files
    # disappear if the container crashes mid-extraction. Cap matches the
    # ZIP_MAX_EXTRACTED_SIZE_MB default × 2 for headroom.
    tmpfs:
      - /tmp/claw-zip-extraction:size=1g,mode=1700
    command: ['./docker-entrypoint.dev.sh']
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'wget --no-check-certificate -qO- https://localhost:4006/api/v1/health || exit 1',
        ]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 45s
    networks:
      - claw-network

  audit-service:
