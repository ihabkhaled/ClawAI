    volumes:
      - ../apps/claw-audit-service/package.json:/app/apps/claw-audit-service/package.json:ro
      - ../apps/claw-audit-service/tsconfig.json:/app/apps/claw-audit-service/tsconfig.json:ro
      - ../apps/claw-audit-service/tsconfig.build.json:/app/apps/claw-audit-service/tsconfig.build.json:ro
      - ../apps/claw-audit-service/src:/app/apps/claw-audit-service/src
      - ../tools:/app/tools:ro
      - ../certs:/certs:ro
    command: npm run dev
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'wget --no-check-certificate -qO- https://localhost:4007/api/v1/health || exit 1',
