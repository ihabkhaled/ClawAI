# NVIDIA GPU passthrough overlay (dev) for Ollama image runtimes.
#
# Auto-loaded only when NVIDIA GPU mode is explicitly enabled.
#
# Requirements:
#   - Linux: NVIDIA Container Toolkit installed
#   - Windows: Docker Desktop with WSL 2 backend + GPU support enabled

name: claw

services:
  ollama:
    gpus: all

  # stable-diffusion is intentionally NOT GPU-accelerated in this overlay.
  # ai-dock/stable-diffusion-webui:latest ships PyTorch built with CUDA
  # kernels only up to SM 9.0 (Hopper). Blackwell (RTX 50-series, SM 12.0)
  # crashes inside model load with
  #   RuntimeError: CUDA error: no kernel image is available for execution
  #   on the device
  # Until ai-dock republishes with PyTorch 2.7+ / CUDA 12.8+ (where sm_120
  # is supported), SD stays on the base compose's CPU + FP32 path. That
  # path actually returns images, just slowly. Ollama still gets the GPU.
