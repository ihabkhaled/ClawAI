# NVIDIA GPU passthrough overlay (dev) for Ollama image runtimes.
#
# Auto-loaded only when NVIDIA GPU mode is explicitly enabled.
#
# Requirements:
#   - Linux: NVIDIA Container Toolkit installed
#   - Windows: Docker Desktop with WSL 2 backend + GPU support enabled

name: claw

services:
  ollama:
    gpus: all

  stable-diffusion:
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    environment:
      # Override the base CPU-mode args when a GPU is present. Without
      # this, SD keeps --use-cpu / --no-half / --precision full set by
      # the base compose file and ignores the GPU entirely. Keep --api
      # --listen so the HTTP API stays reachable on 7860.
      - COMMANDLINE_ARGS=--api --listen
      - WEB_ENABLE_AUTH=false
