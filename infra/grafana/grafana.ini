; Grafana for ClawAI (ADR-115). Operators reach it at https://<site>/grafana/
; from the "Open Grafana" button on /observability — never directly.
;
; Grafana has NO login of its own here. nginx lets a request through only when
; auth-service confirms the admin cookie (auth_request), and then tells Grafana
; who it is in the X-WEBAUTH-EMAIL header ([auth.proxy]). The port is never
; published, so nothing but nginx can set that header.
;
; This file is bind-mounted. Editing it needs a RECREATE, not a restart
; (docs/11-runbooks/runbook-nginx-stale-config.md). scripts/deploy-prod.sh does
; that through CONFIG_DIR_SERVICES.
;
; Two values come from the environment, not from here:
;   GF_SERVER_ROOT_URL     <- ${PUBLIC_SITE_URL}/grafana/
;   GF_SECURITY_SECRET_KEY <- ${GRAFANA_SECRET_KEY} (blank keeps Grafana's default;
;                             nothing here stores an encrypted secret yet)

[server]
protocol = http
http_port = 3000
; Served under /grafana/ by nginx, which passes the path through unchanged.
serve_from_sub_path = true
enforce_domain = false
enable_gzip = true

[security]
; No built-in admin user, so there is no password to set, store or leak.
; Every person in Grafana arrived through the admin session.
disable_initial_admin_creation = true
cookie_secure = true
cookie_samesite = lax
disable_gravatar = true
; Grafana is never framed by the app; nginx sends X-Frame-Options DENY.
allow_embedding = false

[auth]
disable_login_form = true
disable_signout_menu = true

[auth.basic]
enabled = false

[auth.anonymous]
enabled = false

[auth.proxy]
enabled = true
header_name = X-WEBAUTH-EMAIL
header_property = email
auto_sign_up = true
; Re-check the header on every request instead of trusting a Grafana session:
; when the admin session ends, Grafana access ends on the next request.
enable_login_token = false

[users]
allow_sign_up = false
allow_org_create = false
auto_assign_org = true
; Editor, so Explore works. Dashboards that matter are provisioned from
; infra/grafana/dashboards and cannot be overwritten from the UI.
auto_assign_org_role = Editor
default_theme = system

[dashboards]
default_home_dashboard_path = /etc/grafana/dashboards/claw-service-health.json

[analytics]
reporting_enabled = false
check_for_updates = false
check_for_plugin_updates = false
feedback_links_enabled = false

[news]
news_feed_enabled = false

[snapshots]
external_enabled = false

[log]
mode = console
level = warn
