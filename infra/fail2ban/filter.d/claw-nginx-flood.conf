# HTTP 429 answers: a client that keeps hitting a rate limit instead of backing off.
#
# A VERIFIED crawler's 429s are not counted here: claw-nginx-crawler-abuse bans those for one hour only, because
# a multi-day ban of Googlebot or Bingbot would cost the site its search traffic (ADR-232).
[Definition]
failregex = ^<HOST> .*"[^"]*" 429\s
ignoreregex = verdict=verified$
