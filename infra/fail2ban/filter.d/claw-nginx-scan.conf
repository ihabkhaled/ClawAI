# Probes for secrets, source, dependencies and known exploits (incident 2026-11-27: .env, .git, the Vite @id
# injection; ADR-232 adds the files a scanner asks for next and path traversal).
#
# nginx answers all of these with a tiny 404 of its own (locations.conf, $claw_scanner_probe) and still logs
# them. A VERIFIED crawler (verdict=verified) is never banned here: an old WordPress URL that Google remembers
# must cost the site a 404, not a week of Googlebot (ADR-232).
[Definition]
failregex = ^<HOST> .*"(?:GET|POST|HEAD|PUT) /(?:[^ "]*/)?(?:\.env|\.git/|\.aws/|\.ssh/|wp-admin|wp-login|xmlrpc\.php|phpmyadmin|actuator|cgi-bin|@id/__vite|@fs/|vendor/phpunit|server-status|\.DS_Store|config\.php)
            ^<HOST> .*"(?:GET|POST|HEAD|PUT) /(?!api/|_next/)(?:[^ "?]*/)?(?:docker-compose[^ "/?]*|package(?:-lock)?\.json|composer\.(?:json|lock)|swagger[^ "/?]*\.(?:json|ya?ml)|openapi\.(?:json|ya?ml)|\.htaccess|\.htpasswd|\.npmrc|\.svn/|\.hg/)
            ^<HOST> .*"(?:GET|POST|HEAD|PUT) [^ "]*\.php[0-9]?[ ?/]
            ^<HOST> .*"(?:GET|POST|HEAD|PUT) [^ "]*(?:\.\./|%%2e%%2e|%%252e)
# A literal % is written %% in a fail2ban filter (the config parser interpolates %(name)s).
ignoreregex = verdict=verified$
