# A request that CLAIMS to be a crawler whose operator publishes an IP range file (Google, Bing, Apple,
# DuckDuckGo, OpenAI, Perplexity, Mistral, Common Crawl, Ahrefs), from an address OUTSIDE those ranges
# (ADR-232). nginx already answered 403; one such request is proof enough, and the jail bans the address.
#
# The verdict is the last field nginx writes (log_format claw_edge), so nothing a client sends in the
# request line or the User-Agent can fake it: those are quoted and escaped before the field.
#   crawler=google verdict=fake
[Definition]
failregex = ^<HOST> .* crawler=\S+ verdict=fake$
ignoreregex =
