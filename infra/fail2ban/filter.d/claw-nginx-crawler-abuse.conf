# A VERIFIED crawler (its address is in the operator's published ranges) that keeps hammering after nginx
# answered 429 (ADR-232). Good crawlers back off on a 429; one that does not gets a ONE HOUR ban, never days:
# search traffic matters more than a noisy crawler, and the operator's other addresses are untouched.
#   crawler=google verdict=verified
[Definition]
failregex = ^<HOST> .*" 429 \d+ .* verdict=verified$
ignoreregex =
