# Repeat offenders: an address fail2ban banned several times in a day, whichever jail banned it.
#
# The stock recidive filter counts every jail but itself. Two differences, both on purpose:
#   * claw-nginx-crawler-abuse is not counted. A verified crawler is only ever banned for one hour
#     (ADR-232); three of those in a day must never turn into a seven-day ban of Googlebot.
#   * the jail name pattern is spelled out, so a renamed jail cannot silently drop out of the count.
[INCLUDES]
before = common.conf

[Definition]
_daemon = (?:fail2ban(?:-server|\.actions)\s*)
failregex = ^%(__prefix_line)s(?:\s*fail2ban\.actions\s*%(__pid_re)s?:\s+)?NOTICE\s+\[(?!recidive\]|claw-nginx-crawler-abuse\])[^\]]+\]\s+Ban\s+<HOST>\s*$
datepattern = ^{DATE}

ignoreregex =
