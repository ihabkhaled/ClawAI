events {
    worker_connections 1024;
}

http {
    # --- DNS resolver (Docker internal DNS) ---
    # Re-resolves hostnames on every request so nginx survives service restarts
    resolver 127.0.0.11 valid=5s ipv6=off;
    resolver_timeout 3s;

    # --- Timeouts ---
    proxy_connect_timeout 10s;
    proxy_send_timeout    60s;
    proxy_read_timeout    60s;

    # --- Request body ---
    client_max_body_size 75m;

    # --- Payment rate-limit zones ---
    # Financial endpoints are rate-limited at the edge as well as in the app.
    #
    # payment_writes keys mutations on the client IP and covers checkout creation,
    # payment-method setup and subscription changes — the endpoints an attacker
    # would hammer to farm free trials or brute-force a checkout reference.
    #
    # payment_webhooks is deliberately more permissive: a legitimate gateway
    # retries in bursts, and dropping a real webhook costs an entitlement.
    # Authenticity is enforced by signature verification in the service, not
    # here; this zone only bounds flood volume.
    # Safe reads use an empty key. nginx does not count empty limit-zone keys,
    # so billing-page polling cannot exhaust the mutation budget.
    map $request_method $payment_write_key {
        default $binary_remote_addr;
        GET     "";
        HEAD    "";
        OPTIONS "";
    }

    limit_req_zone $payment_write_key zone=payment_writes:10m rate=20r/m;
    limit_req_zone $binary_remote_addr zone=payment_webhooks:10m rate=120r/m;
    limit_req_status 429;

    # --- Security headers ---
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "0" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # --- Hide server version ---
    server_tokens off;

    # --- TLS / SSL config ---
    # This stack serves two different kinds of certificate, and conflating them
    # is the mistake to avoid:
    #
    #   internal — mkcert leaf at /etc/nginx/certs/claw.crt, mounted from
    #              `../certs:/etc/nginx/certs:ro`. Its SANs are container
    #              hostnames, so only the stack can trust it. Regenerate with
    #              `scripts/install-tls.sh` / `install-tls.ps1`.
    #   public   — Let's Encrypt leaf under /etc/letsencrypt/live/<domain>/,
    #              issued by `scripts/install-letsencrypt.sh` and referenced
    #              only from the generated drop-in blocks at the end of this
    #              file. This is the one a browser sees.
    #
    # The settings below apply to both. See docs/08-runtime-devops/tls-setup.md.
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # Trust the mkcert root CA when proxying to HTTPS upstreams so the
    # internal service-to-service hop is verified end-to-end. Without this,
    # nginx would log "SSL certificate verify error" on every request.
    proxy_ssl_trusted_certificate /etc/nginx/certs/rootCA.pem;
    proxy_ssl_verify              on;
    proxy_ssl_verify_depth        2;
    proxy_ssl_server_name         on;

    # ---- Port 80: ACME HTTP-01 challenge, then HTTP -> HTTPS ----
    # Port 80 serves exactly two things:
    #
    #   1. /.well-known/acme-challenge/ — Let's Encrypt fetches the validation
    #      token over PLAIN HTTP from the webroot certbot writes into. This must
    #      be a `location`, not a server-level bypass: a `return 301` in server
    #      context runs in the rewrite phase, BEFORE nginx picks a location, so
    #      it would bounce the CA away from the challenge it came for.
    #
    #   2. Everything else — a permanent redirect to HTTPS.
    #
    # On a local install /var/www/certbot is not mounted and the challenge path
    # simply 404s. That is correct: nothing is validating claw.local.
    server {
        listen 80;
        # Match localhost, claw.local, *.claw.local, and any other Host header
        # (a real public domain included). _ is the catch-all fallback.
        server_name localhost claw.local *.claw.local _;

        location ^~ /.well-known/acme-challenge/ {
            root /var/www/certbot;
            default_type "text/plain";
            try_files $uri =404;
        }

        location / {
            # 301 (permanent) so browsers stop coming back over plain HTTP.
            return 301 https://$host$request_uri;
        }
    }

    # ---- Default TLS server block — mkcert leaf ----
    # Claims localhost, claw.local, and any Host no other block matches.
    #
    # The leaf here is the mkcert certificate, which is the stack's INTERNAL
    # identity: every backend service presents the same cert on its own
    # listener, and nginx verifies them against rootCA.pem when proxying. Its
    # SANs are internal names (auth-service, chat-service, ...) that no public
    # CA can ever issue, so this certificate cannot be replaced by a public one.
    # A browser will not trust it, and on a public domain it should never be the
    # certificate a browser sees.
    #
    # Publicly trusted TLS for a real domain is layered on top by the drop-in
    # include at the bottom of this file — see scripts/install-letsencrypt.sh.
    server {
        listen 443 ssl default_server;
        http2 on;
        server_name localhost claw.local *.claw.local _;

        ssl_certificate     /etc/nginx/certs/claw.crt;
        ssl_certificate_key /etc/nginx/certs/claw.key;

        include /etc/nginx/claw/locations.conf;
    }

    # ---- Public TLS server blocks — Let's Encrypt, generated ----
    # scripts/install-letsencrypt.sh writes one file per public domain into
    # infra/nginx/public-tls/ after certbot issues the certificate, and each
    # one includes the same locations.conf as the block above.
    #
    # A wildcard include that matches no files is not an error in nginx, so the
    # identical nginx.conf boots on a laptop with no public certificate and on a
    # production server that has one. Never replace this with a fixed filename.
    include /etc/nginx/claw/public-tls/*.conf;
}
