# =============================================================================
# ClawAI — shared reverse-proxy routing table
# =============================================================================
# Included by EVERY TLS server block in infra/nginx/nginx.conf, and by the
# generated public-domain block that scripts/install-letsencrypt.sh drops into
# infra/nginx/public-tls/.
#
# It lives in its own file for exactly one reason: a production server serves
# the same routes under two different certificates — the mkcert leaf for
# localhost and internal callers, and a publicly trusted Let's Encrypt leaf for
# the real domain. Duplicating ~400 lines of `location` blocks per certificate
# guarantees the two copies drift, and a drifted route is an outage that only
# shows up on one hostname.
#
# Mounted into the nginx container at /etc/nginx/claw/locations.conf by the
# docker compose volume `../infra/nginx/locations.conf`. This file is NOT a
# server block: it must only ever be included from inside one.
# =============================================================================

    # --- Shared proxy headers ---
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Origin $http_origin;

    # --- Geolocation header sanitization ---
    #
    # nginx is the only ingress, so X-Real-IP above is authoritative: it is
    # OVERWRITTEN with the real socket address on every request. These three
    # are not. A client can send any of them, and without this block they would
    # arrive at the origin looking exactly like something the edge produced.
    #
    # X-Forwarded-For is deliberately left as-is: it APPENDS the real address,
    # so it stays useful for tracing while remaining untrustworthy at its head.
    # Nothing in ClawAI reads its left-most entry - see
    # rules/45-display-currency-versus-settlement-currency.md.
    #
    # If ClawAI ever moves behind Cloudflare, CF-IPCountry stops being blanked
    # here and DISPLAY_FX_TRUST_EDGE_COUNTRY_HEADER is switched on. Not before.
    proxy_set_header CF-IPCountry "";
    proxy_set_header CF-Connecting-IP "";
    proxy_set_header True-Client-IP "";

    # --- Auth Service ---
    location /api/v1/auth {
        set $auth_backend https://auth-service:4001;
        proxy_pass $auth_backend;
    }

    location /api/v1/users {
        set $auth_backend https://auth-service:4001;
        proxy_pass $auth_backend;
    }

    # Payment-owned admin billing routes must win over the generic auth
    # admin prefix below. Both controllers enforce ADMIN_PLANS_MANAGE.
    location /api/v1/admin/billing {
        set $admin_billing_backend https://payment-service:4018;
        proxy_pass $admin_billing_backend;
        client_max_body_size 256k;
        limit_req zone=payment_writes burst=20 nodelay;
    }

    location /api/v1/admin/payment-gateways {
        set $admin_payment_gateways_backend https://payment-service:4018;
        proxy_pass $admin_payment_gateways_backend;
        client_max_body_size 256k;
        limit_req zone=payment_writes burst=20 nodelay;
    }

    # --- PAYG connector credit (auth-service owns the wallet) ---
    #
    # NOT under /api/v1/billing: that prefix already proxies to payment-service,
    # so an auth-owned wallet route placed there would silently resolve to the
    # wrong service in production while passing every localhost test.
    # payment-service keeps the top-up PURCHASE under /api/v1/billing; auth keeps
    # the balance, the ledger and the package catalog here.
    location /api/v1/credit {
        set $credit_backend https://auth-service:4001;
        proxy_pass $credit_backend;
        client_max_body_size 64k;
    }

    # Admin RBAC: plans + roles CRUD (auth-service, ADMIN-gated controllers).
    location /api/v1/admin {
        set $auth_backend https://auth-service:4001;
        proxy_pass $auth_backend;
    }

    # --- Chat Service ---
    location /api/v1/threads {
        set $chat_backend https://chat-service:4002;
        rewrite ^/api/v1/threads/(.*)$ /api/v1/chat-threads/$1 break;
        proxy_pass $chat_backend;
    }

    location /api/v1/messages {
        set $chat_backend https://chat-service:4002;
        rewrite ^/api/v1/messages/(.*)$ /api/v1/chat-messages/$1 break;
        proxy_pass $chat_backend;
    }

    location /api/v1/chat-threads {
        set $chat_backend https://chat-service:4002;
        proxy_pass $chat_backend;
    }

    # What the coding agent did, for a person to read afterwards.
    #
    # Read verbs only, refused at the edge. The web app shows the agent's runs;
    # it does not join in. Denying writes here means a routing mistake behind
    # this line can never turn a transcript into something you can post to.
    location /api/v1/coding-agent-chats {
        limit_except GET HEAD OPTIONS {
            deny all;
        }
        set $chat_backend https://chat-service:4002;
        proxy_pass $chat_backend;
    }

    # Public read-only shared chats. Unauthenticated by design — a visitor
    # following a shared link has no account.
    #
    # Read verbs only. This is a viewing surface, and refusing writes at the
    # edge means a routing mistake behind it can never expose a mutation.
    location /api/v1/public/chat-shares {
        limit_except GET HEAD OPTIONS {
            deny all;
        }
        set $chat_backend https://chat-service:4002;
        proxy_pass $chat_backend;
        # The service sends no-store; do not let a proxy layer reintroduce
        # caching, or a revoked conversation would keep being served.
        proxy_no_cache 1;
        proxy_cache_bypass 1;
    }

    # Sitemap feed for the dynamic half of /sitemap.xml. Returns only an
    # identifier and a timestamp per indexable share — never a title, a
    # thread id, or a user id.
    #
    # Reachable through the proxy because a Vercel-hosted frontend has no
    # docker network to call chat-service on directly; in the Docker stack
    # the frontend calls CHAT_SERVICE_URL and never traverses this block.
    # Read verbs only, and never cached: a revoked share must drop out of
    # the feed on the next build, not when a proxy layer expires.
    location /api/v1/internal/chat-shares {
        limit_except GET HEAD {
            deny all;
        }
        set $chat_backend https://chat-service:4002;
        proxy_pass $chat_backend;
        proxy_no_cache 1;
        proxy_cache_bypass 1;
    }

    location /api/v1/chat-messages/stream {
        set $chat_backend https://chat-service:4002;
        proxy_pass $chat_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_read_timeout 86400;
        proxy_buffering off;
        proxy_cache off;
    }

    # Coding-agent runtime commands. Posting a tool result hands the run back to
    # the platform, which calls the model and only then answers, so the request
    # is open for the length of a model turn — and the service allows itself
    # five minutes for that call. On the inherited 60s this was cut at the edge:
    # the VS Code panel showed "ClawAI request failed (504)" 145 seconds into a
    # run that was working, and the agent lost everything it had done. This sits
    # just above the service's own provider budget so the service's answer, not
    # nginx, is what ends the turn.
    location /api/v1/chat-messages/runtime {
        set $chat_backend https://chat-service:4002;
        proxy_pass $chat_backend;
        proxy_read_timeout 330s;
        proxy_send_timeout 330s;
    }

    location /api/v1/chat-messages/parallel {
        set $chat_backend https://chat-service:4002;
        proxy_pass $chat_backend;
        proxy_read_timeout 180s;
    }

    location /api/v1/chat-messages/consensus {
        set $chat_backend https://chat-service:4002;
        proxy_pass $chat_backend;
        proxy_read_timeout 180s;
    }

    location /api/v1/chat-messages/escalation-chain {
        set $chat_backend https://chat-service:4002;
        proxy_pass $chat_backend;
        proxy_read_timeout 180s;
    }

    location /api/v1/chat-messages/decompose {
        set $chat_backend https://chat-service:4002;
        proxy_pass $chat_backend;
        proxy_read_timeout 30s;
    }

    location /api/v1/chat-messages/best-of-n {
        set $chat_backend https://chat-service:4002;
        proxy_pass $chat_backend;
        proxy_read_timeout 30s;
    }

    location /api/v1/chat-messages/verify {
        set $chat_backend https://chat-service:4002;
        proxy_pass $chat_backend;
        proxy_read_timeout 30s;
    }

    location /api/v1/chat-messages/pipeline {
        set $chat_backend https://chat-service:4002;
        proxy_pass $chat_backend;
        proxy_read_timeout 120s;
    }

    location /api/v1/chat-messages/cost-ensemble {
        set $chat_backend https://chat-service:4002;
        proxy_pass $chat_backend;
        proxy_read_timeout 120s;
    }

    location /api/v1/chat-messages/role-pack {
        set $chat_backend https://chat-service:4002;
        proxy_pass $chat_backend;
        proxy_read_timeout 120s;
    }

    location /api/v1/chat-messages {
        set $chat_backend https://chat-service:4002;
        proxy_pass $chat_backend;
    }

    # --- Connector Service ---
    location /api/v1/connectors {
        set $connector_backend https://connector-service:4003;
        proxy_pass $connector_backend;
    }

    location /api/v1/models {
        set $connector_backend https://connector-service:4003;
        proxy_pass $connector_backend;
    }

    # --- Routing Service ---
    location /api/v1/routing/adaptive-insights {
        set $routing_backend https://routing-service:4004;
        proxy_pass $routing_backend;
        proxy_read_timeout 30s;
    }

    location /api/v1/routing {
        set $routing_backend https://routing-service:4004;
        proxy_pass $routing_backend;
    }

    # Model registry + model COST admin surface. A separate prefix from
    # /api/v1/routing because routing-service mounts these controllers at
    # router-models/* rather than routing/*, so without this block the admin
    # model-cost catalogue 404s at the edge while working perfectly on
    # localhost:4004.
    #
    # /api/v1/internal/router-models is deliberately NOT proxied: that route is
    # the service-token rate card auth-service reads over the docker network,
    # and a rate is a margin input that must never be reachable from the edge.
    location /api/v1/router-models {
        set $routing_backend https://routing-service:4004;
        proxy_pass $routing_backend;
        client_max_body_size 64k;
    }

    # --- Memory Service ---
    location /api/v1/memory {
        set $memory_backend https://memory-service:4005;
        rewrite ^/api/v1/memory/(.*)$ /api/v1/memories/$1 break;
        proxy_pass $memory_backend;
    }

    location /api/v1/context {
        set $memory_backend https://memory-service:4005;
        rewrite ^/api/v1/context/(.*)$ /api/v1/context-packs/$1 break;
        proxy_pass $memory_backend;
    }

    location /api/v1/memories {
        set $memory_backend https://memory-service:4005;
        proxy_pass $memory_backend;
    }

    location /api/v1/context-packs {
        set $memory_backend https://memory-service:4005;
        proxy_pass $memory_backend;
    }

    # --- File Service ---
    location /api/v1/files {
        # An upload waits up to 90 s for a restarting ClamAV (file-service
        # CLAMAV_SCAN_DEADLINE_MS) before failing closed; the default 60 s read
        # timeout would turn that wait into a 504. Keep this above the deadline.
        proxy_read_timeout 150s;
        set $file_backend https://file-service:4006;
        proxy_pass $file_backend;
    }

    # --- Audit Service ---
    location /api/v1/audits {
        set $audit_backend https://audit-service:4007;
        proxy_pass $audit_backend;
    }

    location /api/v1/usage {
        set $audit_backend https://audit-service:4007;
        proxy_pass $audit_backend;
    }

    location /api/v1/feedback {
        set $audit_backend https://audit-service:4007;
        proxy_pass $audit_backend;
    }

    # --- Ollama Service: SSE pull-progress (must come before generic) ---
    location ~ ^/api/v1/ollama/pull-jobs/[^/]+/progress$ {
        set $ollama_sse_backend https://ollama-service:4008;
        proxy_pass $ollama_sse_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_read_timeout 86400;
        proxy_buffering off;
        proxy_cache off;
    }

    # --- Ollama Service ---
    location /api/v1/ollama {
        set $ollama_backend https://ollama-service:4008;
        proxy_pass $ollama_backend;
    }

    # --- Image Service ---
    location /api/v1/images {
        set $image_backend https://image-service:4012;
        proxy_pass $image_backend;
    }

    # --- Image Service SSE ---
    location /api/v1/images/ {
        set $image_backend https://image-service:4012;
        proxy_pass $image_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_read_timeout 86400;
        proxy_buffering off;
        proxy_cache off;
    }

    # --- File Generation Service ---
    location /api/v1/file-generations {
        set $file_gen_backend https://file-generation-service:4013;
        proxy_pass $file_gen_backend;
    }

    # --- File Generation Service SSE ---
    location /api/v1/file-generations/ {
        set $file_gen_backend https://file-generation-service:4013;
        proxy_pass $file_gen_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_read_timeout 86400;
        proxy_buffering off;
        proxy_cache off;
    }

    # --- Workspace Service ---
    # AI action generation runs the LLM synchronously and routinely sits
    # at 60-120s (slow local Ollama models). Must be declared BEFORE the
    # generic /workspace block so nginx's longest-prefix match picks it.
    location /api/v1/workspace/ai-actions/run {
        set $workspace_backend https://workspace-service:4014;
        proxy_pass $workspace_backend;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    location /api/v1/workspace {
        set $workspace_backend https://workspace-service:4014;
        proxy_pass $workspace_backend;
    }

    # --- Agent Service (SSE stream — must be declared before generic) ---
    location ~ ^/api/v1/agent/commands/[^/]+/stream$ {
        set $agent_stream_backend https://agent-service:4015;
        proxy_pass $agent_stream_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # --- Agent Service ---
    location /api/v1/agent {
        set $agent_backend https://agent-service:4015;
        proxy_pass $agent_backend;
    }

    # --- Research Service ---
    location /api/v1/research {
        set $research_backend https://research-service:4016;
        proxy_pass $research_backend;
    }

    # --- Payment Service: gateway webhooks ---
    # Declared BEFORE /api/v1/payments so the longer prefix wins regardless
    # of block ordering, and so webhook-specific limits apply.
    #
    # These routes are intentionally NOT behind the auth layer: a gateway
    # cannot present a ClawAI JWT. Authenticity comes from cryptographic
    # signature verification inside the service (PayPal transmission
    # signature, Paymob HMAC), which is mandatory and constant-time.
    location /api/v1/payments/webhooks {
        set $payment_webhook_backend https://payment-service:4018;
        proxy_pass $payment_webhook_backend;

        # Webhook payloads are small. A tight cap bounds the damage from a
        # flood of oversized bodies aimed at an unauthenticated route.
        client_max_body_size 256k;
        limit_req zone=payment_webhooks burst=40 nodelay;

        # Signatures cover the exact bytes sent. Any transformation here
        # would break verification.
        proxy_request_buffering on;
        proxy_set_header Content-Type $content_type;

        # A gateway retrying is normal and desirable; never cache a reply.
        proxy_buffering off;
        proxy_cache off;
        add_header Cache-Control "no-store" always;
    }

    # --- Payment Service: checkout + gateway order creation ---
    location /api/v1/payments {
        set $payments_backend https://payment-service:4018;
        proxy_pass $payments_backend;

        client_max_body_size 256k;
        limit_req zone=payment_writes burst=10 nodelay;

        # A gateway round trip is slower than a normal API call, but must
        # still be bounded so an outage cannot exhaust worker connections.
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        proxy_cache off;
        add_header Cache-Control "no-store" always;
    }

    # --- Payment Service: billing management (plans, subscription, invoices) ---
    # Declared before /api/v1/billing for readability; nginx picks the longest
    # matching prefix regardless of order.
    location /api/v1/billing/display-currency {
        set $display_currency_backend https://payment-service:4018;
        proxy_pass $display_currency_backend;

        # Read-only and anonymous, but it reaches two free third-party APIs, so
        # it gets its own budget rather than the unlimited GET path.
        limit_req zone=display_currency burst=40 nodelay;

        # Display FX is a presentation enhancement. It must never be able to
        # hold a pricing page open.
        proxy_read_timeout 10s;
        proxy_send_timeout 10s;
    }

    location /api/v1/billing {
        set $billing_backend https://payment-service:4018;
        proxy_pass $billing_backend;

        client_max_body_size 256k;
        limit_req zone=payment_writes burst=20 nodelay;

        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        # Billing state is per-user and changes on payment. Caching it would
        # let one user see another's plan, or show a stale entitlement.
        proxy_cache off;
        add_header Cache-Control "no-store" always;
    }

    # --- Client Logs Service ---
    location /api/v1/client-logs {
        set $client_logs_backend https://client-logs-service:4010;
        proxy_pass $client_logs_backend;
    }

    # --- Ops read channel (read-only ops tokens, ADR-102) -> server-logs ---
    location /api/v1/ops/ {
        set $ops_backend https://server-logs-service:4011;
        proxy_pass $ops_backend;
    }

    # --- Server Logs Service ---
    location /api/v1/server-logs {
        set $server_logs_backend https://server-logs-service:4011;
        proxy_pass $server_logs_backend;
    }

    # --- Llamacpp Service: SSE pull-progress (must come before generic) ---
    # Service controllers are NOT under /llamacpp/ (unlike ollama-service); strip the prefix.
    location ~ ^/api/v1/llamacpp/pull-jobs/[^/]+/progress$ {
        set $llamacpp_sse_backend https://llamacpp-service:4017;
        rewrite ^/api/v1/llamacpp(/.*)$ /api/v1$1 break;
        proxy_pass $llamacpp_sse_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # --- Llamacpp Service: OpenAI-compatible inference (SSE-capable) ---
    location /api/v1/llamacpp/v1/ {
        set $llamacpp_inference_backend https://llamacpp-service:4017;
        rewrite ^/api/v1/llamacpp(/.*)$ /api/v1$1 break;
        proxy_pass $llamacpp_inference_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 86400;
        proxy_request_buffering off;
    }

    # --- Llamacpp Service: catalog / pull / models / hardware / runtime / health ---
    # Service mounts controllers WITHOUT a /llamacpp/ prefix; nginx strips it here.
    location /api/v1/llamacpp/ {
        set $llamacpp_backend https://llamacpp-service:4017;
        rewrite ^/api/v1/llamacpp(/.*)$ /api/v1$1 break;
        proxy_pass $llamacpp_backend;
    }

    # --- Health Service ---
    location /api/v1/health {
        set $health_backend https://health-service:4009;
        proxy_pass $health_backend;
    }

    # --- Grafana, behind the admin session (ADR-115) ---
    #
    # Grafana has no login of its own. Every request under /grafana/ first asks
    # auth-service whether the browser holds a valid admin cookie (claw_grafana,
    # Path=/grafana, minted by POST /api/v1/auth/grafana-access from the admin
    # UI). 204 lets it through and names the admin; anything else is a 401.
    #
    # Variable proxy_pass on purpose: a literal upstream name makes nginx refuse
    # to start while grafana is down, which would take the whole site with it.
    location = /grafana {
        return 301 /grafana/;
    }

    location /grafana/ {
        auth_request /_grafana_auth;
        auth_request_set $grafana_user $upstream_http_x_grafana_user;

        set $grafana_backend http://grafana:3000;
        proxy_pass $grafana_backend;

        # Any proxy_set_header here drops every inherited one, so the shared
        # headers are restated. X-WEBAUTH-EMAIL is the identity Grafana trusts
        # (auth.proxy): it is ALWAYS overwritten with what auth-service said,
        # so a header the browser sends itself never reaches Grafana.
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Origin $http_origin;
        proxy_set_header X-WEBAUTH-EMAIL $grafana_user;

        # Grafana Live streams over a websocket.
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Operational data is per-admin and changes every scrape.
        add_header Cache-Control "no-store" always;
    }

    # The auth_request subrequest. Internal: a browser cannot call it by name.
    # GET with no body, whatever the original method was — a Grafana POST would
    # otherwise reach a GET-only route and turn every save into a 500.
    location = /_grafana_auth {
        internal;
        set $grafana_auth_backend https://auth-service:4001/api/v1/auth/grafana-access/verify;
        proxy_pass $grafana_auth_backend;
        proxy_method GET;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_read_timeout 5s;
    }

    # The verify route exists for the subrequest above and nothing else. It is
    # harmless from outside (it only tells a browser about its own cookie), but
    # a route with no public purpose stays closed.
    location = /api/v1/auth/grafana-access/verify {
        return 404;
    }

    # --- Frontend (Next.js dev server, plain HTTP internally) ---
    # Catch-all: everything that isn't /api/v1/* goes to the Next dev
    # server. Must be declared LAST so longest-prefix match picks the
    # API routes first.
    location / {
        set $frontend_backend http://claw-frontend:3000;
        proxy_pass $frontend_backend;
        proxy_intercept_errors on;
        error_page 502 503 504 =503 /maintenance.html;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400;
    }

    location = /maintenance.html {
        internal;
        default_type text/html;
        root /etc/nginx/claw/public-tls;
        try_files /maintenance.html =503;
        add_header Retry-After "60" always;
        add_header Cache-Control "no-store" always;
    }
