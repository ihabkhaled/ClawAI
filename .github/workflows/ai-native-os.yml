# AI-native engineering OS gates. Runs the SAME authoritative scripts developers
# run locally — no CI-only mystery commands. Pure Node: no Docker, no Prisma.
#
# Called by ci.yml (job `ai-native-os`), so every job here feeds `ci-success`
# and a red gate blocks release and deploy. Running inside the CI run also
# gives it CI's concurrency group (a newer push cancels an older run) and the
# Node version from .nvmrc.
name: ai-native-os

on:
  workflow_call:
    inputs:
      deploy:
        description: The change touches deploy paths, so the deploy rehearsal runs.
        type: boolean
        required: false
        default: false

permissions:
  contents: read

jobs:
  knowledge-freshness:
    name: Knowledge freshness (generated .ai layer)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      # No install needed: the tooling is dependency-light Node ESM (stdlib).
      - name: Audit snapshot is current
        run: node tools/audit/index.mjs --check
      - name: Generated .ai layer is current
        run: node tools/knowledge/build.mjs --check

  knowledge-integrity:
    name: Knowledge integrity (links, docs, no hook-bypass, contradictions)
    # Advisory, not a release gate (owner decision 2026-10-14): a failure shows on the pull request and the
    # push but does not fail the aggregate CI success check, so it cannot block a release. Fix it, do not ignore it.
    continue-on-error: true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      # Includes the rules/63 docs checks: references, counts, duplication.
      - name: knowledge:verify
        run: node tools/knowledge/verify.mjs
      # rules/63: every commit in the pull request declares its docs impact and
      # changes the docs of every mapped code area it touches. (A push to main
      # is a merge of an already-checked pull request.)
      - name: docs:impact (every pull-request commit)
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node tools/knowledge/docs-impact.mjs --range "${BASE_SHA}..${HEAD_SHA}"
      # Rule 33's documentation-discoverability gate. It lives here rather than
      # in the git hooks on purpose: a missing index row never breaks a build —
      # but it does cost the next agent a re-derivation, so CI catches it.
      - name: knowledge:coverage
        run: node tools/knowledge/coverage.mjs

  qa-evidence:
    name: 'QA evidence (rules/60, no feat or fix lands without its record)'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Every feat/fix/perf product commit has a valid docs/qa-evidence record
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            RANGE="origin/${BASE_REF}...HEAD"
          elif [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            echo 'new branch push, nothing to compare'; exit 0
          else
            RANGE="${BEFORE}..${AFTER}"
          fi
          node tools/qa/evidence.mjs check --range "$RANGE"

  tooling-tests:
    name: Tooling tests (audit, knowledge, affected, gates)
    # Advisory, not a release gate (owner decision 2026-10-14): a failure shows on the pull request and the
    # push but does not fail the aggregate CI success check, so it cannot block a release. Fix it, do not ignore it.
    continue-on-error: true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/prepare
        with:
          build-outputs: 'false'
      # The deploy rehearsal (~140s) has its own job, gated on deploy paths.
      - name: knowledge tooling tests
        run: npm run knowledge:test:fast

  deploy-rehearsal:
    name: Deploy rehearsal (deploy paths changed)
    if: inputs.deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: End-to-end deploy rehearsal
        run: npm run knowledge:test:rehearsal

  architecture-rules:
    name: Architecture ESLint rule tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/prepare
        with:
          build-outputs: 'false'
      - name: architecture:check
        run: npm run architecture:check
