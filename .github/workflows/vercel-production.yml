name: Vercel Production

# Production deployment. Runs only on a merge to main or an explicit manual
# dispatch — never from a pull request. Every step is idempotent, so a failed
# run can be re-run from the start once the cause is fixed.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      skip_migrations:
        description: 'Skip database migrations (only when the schema is unchanged)'
        type: boolean
        required: false
        default: false
      service:
        description: 'Deploy a single project key (empty = all)'
        required: false
        default: ''

# Never allow two production deployments to interleave. Unlike preview, an
# in-flight production run is allowed to finish.
concurrency:
  group: vercel-production
  cancel-in-progress: false

env:
  VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
  VERCEL_TEAM_ID: ${{ secrets.VERCEL_TEAM_ID }}
  VERCEL_GIT_REPOSITORY: ${{ github.repository }}
  VERCEL_PRODUCTION_BRANCH: main

jobs:
  quality:
    name: Validate, typecheck, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm rebuild @typescript/native-preview
      - run: npm run vercel:build:shared

      - name: Generated Vercel configs are current
        run: node scripts/vercel/generate-configs.mjs --check

      - name: Validate deployment manifests
        run: node scripts/vercel/validate.mjs --target production

      # A fresh checkout has no generated Prisma clients, so every Prisma-backed
      # service fails typecheck with "Cannot find module '../generated/prisma'".
      # Generate for every workspace that ships a schema — including the two
      # not-vercel-compatible services, because the all-workspace typecheck and
      # test steps below still compile them.
      - name: Generate Prisma clients
        shell: bash
        run: |
          set -euo pipefail
          # `npx prisma generate` rather than the prisma:generate npm script,
          # because claw-llamacpp-service and claw-ollama-service ship a schema
          # without that script (same approach ci.yml uses).
          for schema in apps/*/prisma/schema.prisma; do
            service_dir=$(dirname "$(dirname "$schema")")
            echo "::group::prisma generate $service_dir"
            (cd "$service_dir" && npx prisma generate)
            echo "::endgroup::"
          done

      - name: Typecheck all workspaces
        run: npm run typecheck

      - name: Test all workspaces
        run: npm run test

      - name: Upload validation report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: vercel-validation-production
          path: deploy/vercel/generated/validation-report.json
          if-no-files-found: ignore

  deploy:
    name: Deploy production
    runs-on: ubuntu-latest
    needs: quality
    environment:
      name: production
    env:
      # A step-level `if` cannot read the secrets context; job-level env can.
      HAS_APP_SECRETS: ${{ secrets.JWT_SECRET != '' }}
      HAS_DIRECT_DB_URLS: ${{ secrets.AUTH_DIRECT_DATABASE_URL != '' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm i -g vercel@latest

      # Vercel holds the application and database secrets. Only the two Vercel
      # credentials live in GitHub, which keeps database URLs out of this runner
      # and therefore out of any workflow log.
      - name: Provision missing projects
        run: node scripts/vercel/provision.mjs --all

      # sync-env is what PUTS the application secrets into Vercel, so on the
      # first run they have to come from somewhere. Two supported paths:
      #
      #   1. Add them as GitHub secrets — this step then pushes them to Vercel.
      #   2. Run `npm run vercel:env:sync` once from a machine with a filled
      #      .env.vercel. Vercel then holds the values and CI never needs them.
      #
      # The step is gated on JWT_SECRET so path 2 does not fail the pipeline:
      # with no secrets in GitHub it is skipped, and whatever is already in
      # Vercel stays untouched.
      - name: Sync production environment variables
        if: env.HAS_APP_SECRETS == 'true'
        env:
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          ENCRYPTION_KEY: ${{ secrets.ENCRYPTION_KEY }}
          INTER_SERVICE_AUTH_TOKEN: ${{ secrets.INTER_SERVICE_AUTH_TOKEN }}
          REDIS_URL: ${{ secrets.REDIS_URL }}
          RABBITMQ_URL: ${{ secrets.RABBITMQ_URL }}
          CORS_ORIGINS: ${{ secrets.CORS_ORIGINS }}
          OLLAMA_BASE_URL: ${{ secrets.OLLAMA_BASE_URL }}
          OLLAMA_API_KEY: ${{ secrets.OLLAMA_API_KEY }}
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
          AUTH_DATABASE_URL: ${{ secrets.AUTH_DATABASE_URL }}
          CHAT_DATABASE_URL: ${{ secrets.CHAT_DATABASE_URL }}
          CONNECTOR_DATABASE_URL: ${{ secrets.CONNECTOR_DATABASE_URL }}
          ROUTING_DATABASE_URL: ${{ secrets.ROUTING_DATABASE_URL }}
          MEMORY_DATABASE_URL: ${{ secrets.MEMORY_DATABASE_URL }}
          FILES_DATABASE_URL: ${{ secrets.FILES_DATABASE_URL }}
          IMAGE_DATABASE_URL: ${{ secrets.IMAGE_DATABASE_URL }}
          FILE_GENERATION_DATABASE_URL: ${{ secrets.FILE_GENERATION_DATABASE_URL }}
          WORKSPACE_DATABASE_URL: ${{ secrets.WORKSPACE_DATABASE_URL }}
          AGENT_DATABASE_URL: ${{ secrets.AGENT_DATABASE_URL }}
          RESEARCH_DATABASE_URL: ${{ secrets.RESEARCH_DATABASE_URL }}
          AUDIT_MONGODB_URL: ${{ secrets.AUDIT_MONGODB_URL }}
          CLIENT_LOGS_MONGODB_URL: ${{ secrets.CLIENT_LOGS_MONGODB_URL }}
          SERVER_LOGS_MONGODB_URL: ${{ secrets.SERVER_LOGS_MONGODB_URL }}
        run: node scripts/vercel/sync-env.mjs --all --target production

      - name: Skip environment sync
        if: env.HAS_APP_SECRETS != 'true'
        run: |
          echo "No application secrets in GitHub — leaving the values already stored in Vercel untouched."
          echo "To drive the sync from CI, add the secrets listed in .env.vercel.example to this environment."

      # Migrations need the direct (non-pooled) database URLs. Skipped entirely
      # when they are not available rather than failing the deployment.
      - name: Run database migrations
        if: github.event.inputs.skip_migrations != 'true' && env.HAS_DIRECT_DB_URLS == 'true'
        env:
          AUTH_DIRECT_DATABASE_URL: ${{ secrets.AUTH_DIRECT_DATABASE_URL }}
          CHAT_DIRECT_DATABASE_URL: ${{ secrets.CHAT_DIRECT_DATABASE_URL }}
          CONNECTOR_DIRECT_DATABASE_URL: ${{ secrets.CONNECTOR_DIRECT_DATABASE_URL }}
          ROUTING_DIRECT_DATABASE_URL: ${{ secrets.ROUTING_DIRECT_DATABASE_URL }}
          MEMORY_DIRECT_DATABASE_URL: ${{ secrets.MEMORY_DIRECT_DATABASE_URL }}
          FILES_DIRECT_DATABASE_URL: ${{ secrets.FILES_DIRECT_DATABASE_URL }}
          IMAGE_DIRECT_DATABASE_URL: ${{ secrets.IMAGE_DIRECT_DATABASE_URL }}
          FILE_GENERATION_DIRECT_DATABASE_URL: ${{ secrets.FILE_GENERATION_DIRECT_DATABASE_URL }}
          WORKSPACE_DIRECT_DATABASE_URL: ${{ secrets.WORKSPACE_DIRECT_DATABASE_URL }}
          AGENT_DIRECT_DATABASE_URL: ${{ secrets.AGENT_DIRECT_DATABASE_URL }}
          RESEARCH_DIRECT_DATABASE_URL: ${{ secrets.RESEARCH_DIRECT_DATABASE_URL }}
          AUDIT_MONGODB_URL: ${{ secrets.AUDIT_MONGODB_URL }}
          CLIENT_LOGS_MONGODB_URL: ${{ secrets.CLIENT_LOGS_MONGODB_URL }}
          SERVER_LOGS_MONGODB_URL: ${{ secrets.SERVER_LOGS_MONGODB_URL }}
        run: node scripts/vercel/migrate.mjs --all

      - name: Skip database migrations
        if: env.HAS_DIRECT_DB_URLS != 'true'
        run: echo "No direct database URLs in GitHub — skipping migrations. Run 'npm run vercel:migrate' locally instead."

      - name: Deploy backend services
        if: github.event.inputs.service == ''
        shell: bash
        run: |
          set -euo pipefail
          KEYS=$(node -e "
            const m = require('./deploy/vercel/projects.json');
            console.log(m.projects
              .filter(p => p.status === 'enabled' && p.key !== 'frontend')
              .map(p => p.key).join(' '));
          ")
          for key in $KEYS; do
            node scripts/vercel/deploy.mjs --service "$key" --target production
          done

      - name: Deploy a single project
        if: github.event.inputs.service != ''
        run: node scripts/vercel/deploy.mjs --service "${{ github.event.inputs.service }}" --target production

      - name: Resolve and sync production service URLs
        run: node scripts/vercel/resolve-service-urls.mjs --target production --sync

      # The frontend goes last, after every backend URL is in place, so it never
      # ships pointing at a service that has not been updated yet.
      - name: Deploy frontend
        if: github.event.inputs.service == ''
        run: node scripts/vercel/deploy.mjs --service frontend --target production

      - name: Verify production deployment
        id: verify
        run: node scripts/vercel/verify.mjs --target production

      - name: Upload deployment artefacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: vercel-production-reports
          path: |
            deploy/vercel/generated/deployments.production.json
            deploy/vercel/generated/verification-report.json
            deploy/vercel/generated/verification-report.md
          if-no-files-found: ignore

      - name: Job summary
        if: always()
        shell: bash
        run: |
          if [ -f deploy/vercel/generated/verification-report.md ]; then
            cat deploy/vercel/generated/verification-report.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'No verification report was produced.' >> "$GITHUB_STEP_SUMMARY"
          fi
