name: Security scan

# What a push-triggered run cannot see: a secret anywhere in the WHOLE git
# history, and advisories published after the last push. Weekly and on demand.
# A finding fails the run, and GitHub emails the owner about a failed scheduled
# run. The same scans run locally with
#   npm run security:check -- --history --level=moderate
# (rules/69, skills/secure-every-change.md). ci.yml scans every push and pull
# request; this workflow adds the history and the stricter dependency level.
#
# The history scan reads tools/security/.gitleaksignore: reviewed historical
# findings (the retired admin password, test fixtures), one fingerprint per
# commit, so the same text in a new commit is still a finding.
#
# Third-party actions are pinned to commit SHAs; downloaded tools are pinned to
# a version and a SHA-256.

on:
  schedule:
    - cron: '23 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-scan
  cancel-in-progress: false

jobs:
  gitleaks-history:
    name: Secret scan (gitleaks, whole history)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Install gitleaks (pinned release, pinned checksum)
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          set -euo pipefail
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$RUNNER_TEMP/$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$archive"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/$archive" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" gitleaks
      - name: Scan every commit in the history
        run: >-
          "$RUNNER_TEMP/gitleaks" git --redact --no-banner --config .gitleaks.toml
          --gitleaks-ignore-path tools/security

  dependencies:
    name: Dependencies (npm audit at moderate, OSV-Scanner)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      # Development tools count too: a compromised build or test tool reaches
      # every artefact. The reviewed allowlist (tools/security/audit-allowlist.json,
      # reason + reviewer + expiry) is the only exception path.
      - name: npm audit over every dependency (moderate and above, reviewed allowlist) and action pins
        run: node tools/security/security-check.mjs --only=audit,pins --level=moderate --strict
      - name: Install OSV-Scanner (pinned release, pinned checksum)
        env:
          OSV_VERSION: 2.7.1
          OSV_SHA256: fb7dab19a8bd9bbe5c3189f09d4b7ee1820c9553a23bac202648a56efd2f6ee8
        run: |
          set -euo pipefail
          curl -sSfL -o "$RUNNER_TEMP/osv-scanner" \
            "https://github.com/google/osv-scanner/releases/download/v${OSV_VERSION}/osv-scanner_linux_amd64"
          echo "${OSV_SHA256}  $RUNNER_TEMP/osv-scanner" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/osv-scanner"
      - name: Scan the lockfile
        run: '"$RUNNER_TEMP/osv-scanner" scan source --lockfile package-lock.json'
