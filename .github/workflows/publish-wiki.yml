name: Publish GitHub Wiki

on:
  push:
    branches:
      - main
    paths:
      - 'wiki/**'
      - '.github/workflows/publish-wiki.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-github-wiki
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # One workflow publishes the wiki. `wiki-sync.yml` did the same job and
      # failed alongside this one; it was removed on 2026-09-19.
      - name: Publish wiki sources
        env:
          # A WIKI_TOKEN secret (a PAT with contents:write) is used when set,
          # in case the default token cannot push to the wiki repository.
          GH_TOKEN: ${{ secrets.WIKI_TOKEN || github.token }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail

          remote="https://x-access-token:${GH_TOKEN}@github.com/${REPOSITORY}.wiki.git"
          workdir="$(mktemp -d)"

          # GitHub creates <repo>.wiki.git only after the FIRST wiki page is
          # saved in the web UI; no API can do it. Until then there is nothing
          # to push to, so say what to do once and pass instead of failing
          # every push to main (it failed with "Repository not found").
          if ! git ls-remote "${remote}" >/dev/null 2>&1; then
            echo "::warning title=GitHub Wiki not initialized::Open https://github.com/${REPOSITORY}/wiki, click 'Create the first page', save it, then re-run this workflow. The wiki/ sources were not published."
            exit 0
          fi
          git clone "${remote}" "${workdir}/wiki-repo"

          rsync -a --delete --exclude='.git/' wiki/ "${workdir}/wiki-repo/"

          cd "${workdir}/wiki-repo"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A
          if git diff --cached --quiet; then
            echo "Wiki is already up to date."
            exit 0
          fi

          git commit -m "docs: sync ClawAI wiki"
          git push origin HEAD:master
