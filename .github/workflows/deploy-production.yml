name: Deploy production

# Ships the EXACT commit CI just proved green to the GoDaddy VPS at
# /srv/clawai. Never fires for a pull request, never fires for `develop`, and
# never deploys whatever `origin/main` happens to be by the time this runs —
# only github.event.workflow_run.head_sha, the commit CI actually tested.
#
# All the real work — selective service detection, build, health
# verification, and recording the deployed SHA — lives in
# scripts/deploy-prod.sh so it is identical whether GitHub Actions runs it or
# an operator runs it by hand on the box. See docs/PRODUCTION_DEPLOYMENT.md.

on:
  workflow_run:
    workflows: ['CI']
    types: [completed]
  workflow_dispatch:
    inputs:
      target_sha:
        description: Exact commit SHA to deploy (blank uses the selected ref, normally current main)
        required: false
        type: string

permissions:
  contents: read

# Two production deployments must never run against the VPS simultaneously.
# cancel-in-progress stays false: a queued deployment for a newer commit still
# has to wait for the currently running one to finish (or fail) rather than
# racing it — scripts/deploy-prod.sh also holds a server-side flock as a
# second, independent guard against concurrent runs.
concurrency:
  group: clawai-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy ${{ github.event_name == 'workflow_dispatch' && (inputs.target_sha || github.sha) || github.event.workflow_run.head_sha }}
    runs-on: ubuntu-latest
    environment: production
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main')
    steps:
      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.PROD_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.PROD_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          # Written from a secret, never logged. StrictHostKeyChecking stays
          # on the default (yes); the provided known_hosts is what makes that
          # succeed instead of hanging on an interactive prompt.
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy over SSH
        env:
          PROD_HOST: ${{ secrets.PROD_HOST }}
          PROD_USER: ${{ secrets.PROD_USER }}
          PROD_PORT: ${{ secrets.PROD_PORT }}
          TARGET_SHA: ${{ github.event_name == 'workflow_dispatch' && (inputs.target_sha || github.sha) || github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          if [[ ! "$TARGET_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "Target must be an exact 40-character commit SHA." >&2
            exit 2
          fi
          echo "Target production SHA: $TARGET_SHA"
          retry_delays=(10 20 40 60 90)
          ssh_output="$(mktemp)"
          trap 'rm -f "$ssh_output"' EXIT

          # One initial attempt plus five bounded retries. Only OpenSSH exit 255
          # with a recognized transport diagnostic is retried. A remote deploy,
          # Docker, migration, or health failure is returned immediately.
          for attempt in 1 2 3 4 5 6; do
            : > "$ssh_output"
            set +e
            ssh -i ~/.ssh/deploy_key \
                -o UserKnownHostsFile=~/.ssh/known_hosts \
                -o BatchMode=yes \
                -o ConnectTimeout=20 \
                -p "$PROD_PORT" \
                "$PROD_USER@$PROD_HOST" \
                "cd /srv/clawai && echo 'CLAW_SSH_CONNECTED' && echo 'Server deployed SHA before:' && (cat .deploy/deployed-sha 2>/dev/null || echo '<none>') && bash ./scripts/deploy-prod.sh '$TARGET_SHA' && echo 'Server deployed SHA after:' && cat .deploy/deployed-sha" \
                2>&1 | tee "$ssh_output"
            ssh_status="${PIPESTATUS[0]}"
            set -e

            if [ "$ssh_status" -eq 0 ]; then
              exit 0
            fi

            if [ "$ssh_status" -ne 255 ] || grep -q 'CLAW_SSH_CONNECTED' "$ssh_output" || ! grep -Eq \
              'Connection timed out|Connection refused|No route to host|Could not resolve hostname|Connection reset by peer|Connection closed by remote host|kex_exchange_identification' \
              "$ssh_output"; then
              echo "Deployment failed after SSH connected; refusing to retry application failure." >&2
              exit "$ssh_status"
            fi

            if [ "$attempt" -eq 6 ]; then
              echo "SSH connectivity failed after 6 attempts (5 retries)." >&2
              exit "$ssh_status"
            fi

            delay="${retry_delays[$((attempt - 1))]}"
            echo "SSH connectivity attempt $attempt failed; retrying in ${delay}s." >&2
            sleep "$delay"
          done

      - name: Clean up SSH material
        if: always()
        run: rm -rf ~/.ssh/deploy_key ~/.ssh/known_hosts
