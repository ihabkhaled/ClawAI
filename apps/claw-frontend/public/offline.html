<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta name="theme-color" content="#0B1220" />
    <title>ClawAI — Offline</title>
    <style>
      :root { color-scheme: light dark; font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      body { margin: 0; min-height: 100dvh; display: grid; place-items: center; background: #0b1220; color: #f8fafc; padding: max(24px, env(safe-area-inset-top)) max(20px, env(safe-area-inset-right)) max(24px, env(safe-area-inset-bottom)) max(20px, env(safe-area-inset-left)); box-sizing: border-box; }
      main { width: min(100%, 420px); border: 1px solid rgba(148,163,184,.28); border-radius: 18px; padding: 28px; background: rgba(15,23,42,.92); box-shadow: 0 20px 60px rgba(0,0,0,.28); }
      h1 { margin: 0 0 10px; font-size: 28px; }
      p { margin: 0 0 22px; line-height: 1.6; color: #cbd5e1; }
      button { min-height: 44px; width: 100%; border: 0; border-radius: 10px; background: #3b82f6; color: white; font: inherit; font-weight: 600; padding: 10px 16px; }
    </style>
  </head>
  <body>
    <main>
      <h1>You’re offline</h1>
      <p>ClawAI cannot reach the network right now. Reconnect and retry; previously cached pages may still be available.</p>
      <button type="button" onclick="location.reload()">Retry</button>
    </main>
  </body>
</html>
