# Intel/generic Vulkan GPU passthrough overlay (dev) for claw-llamacpp-service.
# Auto-loaded by ./scripts/claw.sh when /dev/dri/render* is detected and no NVIDIA/ROCm.
#
# Suitable for:
#   - Intel Arc / iGPUs with Vulkan support
#   - Any Linux GPU exposing a render node under /dev/dri

services:
  llamacpp-service:
    devices:
      - /dev/dri
    group_add:
      - video
      - render
